<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLoot Admin | Full Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (same styles as before, keep unchanged) */
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0a0c12;color:#eef2ff;}
        .admin-container{display:flex;min-height:100vh;}
        .sidebar{width:280px;background:rgba(18,22,35,0.85);backdrop-filter:blur(12px);border-right:1px solid rgba(0,255,255,0.2);padding:2rem 1rem;position:fixed;height:100vh;overflow-y:auto;}
        .logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2rem;text-align:center;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 18px;margin:8px 0;border-radius:16px;cursor:pointer;color:#b9c3e6;}
        .nav-item i{width:24px;}
        .nav-item.active,.nav-item:hover{background:rgba(0,242,254,0.15);color:#00f2fe;border-left:3px solid #00f2fe;}
        .main-content{flex:1;margin-left:280px;padding:2rem;}
        .dashboard-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin-bottom:2rem;}
        .card{background:rgba(20,25,45,0.7);backdrop-filter:blur(8px);border:1px solid rgba(0,255,255,0.2);border-radius:28px;padding:1.5rem;}
        .card h3{font-size:1rem;color:#8e9acf;}
        .card .value{font-size:2.2rem;font-weight:700;margin-top:0.5rem;}
        .section-title{font-size:1.4rem;font-weight:600;margin:2rem 0 1rem;border-left:4px solid #00f2fe;padding-left:1rem;}
        table{width:100%;background:rgba(12,16,28,0.7);border-radius:24px;overflow-x:auto;border-collapse:collapse;}
        th,td{padding:14px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.1);}
        th{background:#0f1222;color:#00f2fe;}
        .btn-sm{background:#1e2a47;border:none;padding:6px 12px;border-radius:40px;color:white;cursor:pointer;margin:0 4px;}
        .btn-approve{background:#10b981;}
        .btn-reject{background:#ef4444;}
        .flex-btns{display:flex;gap:6px;flex-wrap:wrap;}
        button{background:linear-gradient(135deg,#00c6fb,#005bea);border:none;padding:10px 20px;border-radius:40px;color:white;font-weight:bold;cursor:pointer;}
        input,textarea,select{background:#1f2937;border:1px solid #374151;padding:10px;border-radius:20px;color:white;width:100%;margin:8px 0;}
        @media (max-width:768px){.sidebar{width:80px;padding:1rem 0.5rem;}.sidebar .logo{font-size:1rem;}.nav-item span{display:none;}.main-content{margin-left:80px;}}
        .kyc-review-card{background:#0f172a;border-radius:24px;padding:1.2rem;margin-bottom:1.2rem;border:1px solid #2a3a5a;}
        .kyc-images-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:15px 0;}
        .kyc-image{background:#00000040;border-radius:16px;padding:8px;text-align:center;}
        .kyc-image img{max-width:100%;max-height:120px;border-radius:12px;cursor:pointer;}
        .submission-detail{ background:#0f1222; padding:1rem; border-radius:16px; margin:0.5rem 0; }
        .field-value{ margin:0.5rem 0; border-left:2px solid cyan; padding-left:0.8rem; }
        .leaderboard-card { background:#0f172a; border-radius:24px; padding:1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; }
        .rank { font-size:1.5rem; font-weight:bold; color:#00f2fe; width:50px; }
        .fraud-warning { background:#7f1a1a; border-radius:16px; padding:0.5rem; margin-top:0.5rem; color:#ffaaaa; }
        .field-builder { background:#0f1222; padding:1rem; border-radius:16px; margin-top:1rem; }
        .field-item { background:#1a1e2e; padding:0.8rem; margin:0.5rem 0; border-radius:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo">🎮 GAMELOOT<br><span style="font-size:12px;">ADMIN</span></div>
        <div class="nav-item active" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
        <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Tasks</span></div>
        <div class="nav-item" data-tab="submissions"><i class="fas fa-clipboard-list"></i><span>Submissions</span></div>
        <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC Reviews</span></div>
        <div class="nav-item" data-tab="users"><i class="fas fa-users"></i><span>Users</span></div>
        <div class="nav-item" data-tab="withdrawals"><i class="fas fa-money-bill-wave"></i><span>Withdrawals</span></div>
        <div class="nav-item" data-tab="leaderboard"><i class="fas fa-trophy"></i><span>Leaderboard</span></div>
        <div class="nav-item" data-tab="fraud"><i class="fas fa-shield-alt"></i><span>Fraud Detection</span></div>
        <div class="nav-item" data-tab="chat"><i class="fas fa-comment-dots"></i><span>Support Chat</span></div>
        <div class="nav-item" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>
    <div class="main-content" id="adminMain"></div>
</div>

<script>
(function(){
    const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentAdmin = null;

    async function getSignedUrl(path, bucket = 'kyc_docs', expiresIn = 3600) {
        if (!path) return null;
        try { const { data, error } = await supabase.storage.from(bucket).createSignedUrl(path, expiresIn); if (error) return null; return data.signedUrl; } catch(e){ return null; }
    }

    async function checkAdminAuth(){
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "user.html"; return; }
        const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
        if (!profile || !profile.is_admin) {
            await supabase.auth.signOut();
            Swal.fire("Access Denied", "You are not an administrator.", "error");
            window.location.href = "user.html";
            return;
        }
        currentAdmin = user;
        loadTab('dashboard');
    }

    async function fetchStats(){
        const { count: totalUsers } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
        const { count: totalTasks } = await supabase.from('tasks').select('*', { count: 'exact', head: true });
        const { data: submissions } = await supabase.from('submissions').select('reward, status');
        let totalRewards = 0;
        submissions?.forEach(s => { if(s.status === 'approved') totalRewards += s.reward; });
        const { count: pendingKyc } = await supabase.from('verifications').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        const { count: pendingSub } = await supabase.from('submissions').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        return { totalUsers, totalTasks, totalRewards, pendingKyc, pendingSub };
    }

    async function renderDashboard(){
        const s = await fetchStats();
        return `<h2 class="section-title">Analytics</h2><div class="dashboard-cards">
            <div class="card"><h3>Total Users</h3><div class="value">${s.totalUsers||0}</div></div>
            <div class="card"><h3>Total Tasks</h3><div class="value">${s.totalTasks||0}</div></div>
            <div class="card"><h3>Rewards Paid</h3><div class="value">₹${s.totalRewards||0}</div></div>
            <div class="card"><h3>Pending KYC</h3><div class="value">${s.pendingKyc||0}</div></div>
            <div class="card"><h3>Pending Submissions</h3><div class="value">${s.pendingSub||0}</div></div>
        </div>`;
    }

    // ==================== TASK MANAGEMENT (FIXED) ====================
    let tempCustomFields = [];

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function renderFieldsList(){
        const container = document.getElementById('fieldsList');
        if(!container) return;
        container.innerHTML = tempCustomFields.map((f, idx) => `
            <div class="field-item">
                <input type="text" value="${escapeHtml(f.label)}" placeholder="Field Label" style="flex:2;" onchange="tempCustomFields[${idx}].label = this.value">
                <select onchange="tempCustomFields[${idx}].type = this.value" style="flex:1;">
                    <option value="text" ${f.type==='text'?'selected':''}>Text</option>
                    <option value="email" ${f.type==='email'?'selected':''}>Email</option>
                    <option value="number" ${f.type==='number'?'selected':''}>Number</option>
                    <option value="file" ${f.type==='file'?'selected':''}>File Upload</option>
                </select>
                <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" ${f.required ? 'checked' : ''} onchange="tempCustomFields[${idx}].required = this.checked"> Required</label>
                <button class="btn-sm" onclick="tempCustomFields.splice(${idx},1); renderFieldsList()">Remove</button>
            </div>
        `).join('');
    }

    async function addFieldModal(){
        const { value: field } = await Swal.fire({
            title: 'Add Custom Field',
            html: `<input id="fieldLabel" placeholder="Field Label" class="swal2-input">
                   <select id="fieldType" class="swal2-select">
                       <option value="text">Text</option>
                       <option value="email">Email</option>
                       <option value="number">Number</option>
                       <option value="file">File Upload (any type)</option>
                   </select>
                   <label><input type="checkbox" id="fieldRequired"> Required</label>`,
            preConfirm: () => {
                const label = document.getElementById('fieldLabel').value.trim();
                const type = document.getElementById('fieldType').value;
                const required = document.getElementById('fieldRequired').checked;
                if(!label) Swal.showValidationMessage('Label is required');
                else return { label, type, required };
            }
        });
        return field;
    }

    function showTaskModal(task = null){
        tempCustomFields = task ? (task.custom_fields || []) : [];
        Swal.fire({
            title: task ? 'Edit Task' : 'New Task',
            html: `
                <input id="taskTitle" value="${task?.title || ''}" placeholder="Task Title" class="swal2-input">
                <textarea id="taskDesc" placeholder="Description" class="swal2-textarea">${task?.description || ''}</textarea>
                <input id="taskReward" value="${task?.reward || ''}" placeholder="Reward Amount (₹)" class="swal2-input">
                <input id="taskLink" value="${task?.link || ''}" placeholder="Task URL (optional)" class="swal2-input">
                <textarea id="helpText" placeholder="Help text (HTML allowed)" class="swal2-textarea">${task?.help_text || ''}</textarea>
                <input id="deadline" type="datetime-local" value="${task?.deadline ? new Date(task.deadline).toISOString().slice(0,16) : ''}" class="swal2-input">
                <div class="field-builder">
                    <h4>Custom Fields (user must fill)</h4>
                    <div id="fieldsList"></div>
                    <button type="button" id="addFieldBtn" class="btn-sm">+ Add Field</button>
                </div>
            `,
            focusConfirm: false,
            width: '800px',
            preConfirm: () => {
                const title = document.getElementById('taskTitle').value.trim();
                const description = document.getElementById('taskDesc').value;
                const reward = parseInt(document.getElementById('taskReward').value);
                const link = document.getElementById('taskLink').value.trim();
                const help_text = document.getElementById('helpText').value;
                const deadline = document.getElementById('deadline').value ? new Date(document.getElementById('deadline').value).toISOString() : null;
                // Validate custom fields
                for (let i = 0; i < tempCustomFields.length; i++) {
                    if (!tempCustomFields[i].label || tempCustomFields[i].label.trim() === '') {
                        Swal.showValidationMessage(`Custom field #${i+1} has no label.`);
                        return false;
                    }
                }
                if(!title) Swal.showValidationMessage('Title required');
                else if(isNaN(reward) || reward <= 0) Swal.showValidationMessage('Valid reward required');
                else return { title, description, reward, link, help_text, deadline, custom_fields: tempCustomFields };
            },
            didOpen: () => {
                renderFieldsList();
                document.getElementById('addFieldBtn').addEventListener('click', async () => {
                    const newField = await addFieldModal();
                    if(newField) { tempCustomFields.push(newField); renderFieldsList(); }
                });
            }
        }).then(async (result) => {
            if(result.value){
                const data = result.value;
                console.log("Submitting task data:", data); // DEBUG
                if(task){
                    const { error } = await supabase.from('tasks').update(data).eq('id', task.id);
                    if(error) {
                        console.error("Update error:", error);
                        Swal.fire("Error", error.message, "error");
                    } else {
                        Swal.fire("Updated", "Task updated successfully", "success");
                    }
                } else {
                    const { error } = await supabase.from('tasks').insert({ ...data, created_at: new Date() });
                    if(error) {
                        console.error("Insert error:", error);
                        Swal.fire("Error", error.message, "error");
                    } else {
                        Swal.fire("Added", "Task created successfully", "success");
                    }
                }
                loadTab('tasks');
            }
        });
    }

    async function renderTasks(){
        const { data: tasks } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        return `<div style="display:flex; justify-content:space-between;"><h2 class="section-title">Manage Tasks</h2><button id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button></div>
        <div class="table-responsive">
        <table><thead><tr><th>Title</th><th>Reward</th><th>Deadline</th><th>Fields</th><th>Actions</th></tr></thead><tbody>
        ${tasks?.map(t => `<tr>
            <td>${escapeHtml(t.title)}</td>
            <td>₹${t.reward}</td>
            <td>${t.deadline ? new Date(t.deadline).toLocaleString() : '-'}</td>
            <td>${t.custom_fields?.length || 0}</td>
            <td class="flex-btns"><button class="btn-sm editTask" data-task='${JSON.stringify(t)}'>Edit</button><button class="btn-sm btn-reject deleteTask" data-id="${t.id}">Delete</button></td>
        </tr>`).join('') || '<tr><td colspan="5">No tasks</td></tr>'}
        </tbody></table>
        </div>`;
    }

    // ==================== SUBMISSIONS ====================
    async function renderSubmissions(){
        const { data: subs } = await supabase.from('submissions').select('*, tasks(title, custom_fields, reward), profiles(name)').eq('status', 'pending');
        if(!subs?.length) return `<h2 class="section-title">Pending Submissions</h2><p>No pending submissions.</p>`;
        let html = `<h2 class="section-title">Pending Submissions</h2>`;
        for(const s of subs){
            const customFields = s.tasks?.custom_fields || [];
            let submissionHtml = `<div class="submission-detail">
                <strong>User:</strong> ${s.profiles?.name}<br>
                <strong>Task:</strong> ${s.tasks?.title}<br>
                <strong>Reward:</strong> ₹${s.reward}<br>
                <strong>Submitted Data:</strong><br>`;
            if(s.submission_data){
                for(const field of customFields){
                    const value = s.submission_data[field.label];
                    if(field.type === 'file' && value){
                        const fileUrl = await getSignedUrl(value, 'task_submissions');
                        submissionHtml += `<div class="field-value"><strong>${field.label}:</strong> <a href="${fileUrl}" target="_blank">📎 Download/View File</a></div>`;
                    } else {
                        submissionHtml += `<div class="field-value"><strong>${field.label}:</strong> ${value || '-'}</div>`;
                    }
                }
            } else {
                submissionHtml += `<div class="field-value">No custom data</div>`;
            }
            submissionHtml += `<div class="flex-btns" style="margin-top:1rem;">
                <button class="btn-sm btn-approve approveSub" data-id="${s.id}" data-uid="${s.uid}" data-reward="${s.reward}" data-task-id="${s.task_id}">Approve</button>
                <button class="btn-sm btn-reject rejectSub" data-id="${s.id}">Reject with Feedback</button>
                <button class="btn-sm requestInfoSub" data-id="${s.id}" data-uid="${s.uid}">Request More Info</button>
            </div></div>`;
            html += submissionHtml;
        }
        return html;
    }

    // ==================== KYC, USERS, WITHDRAWALS, LEADERBOARD, FRAUD, CHAT (keep existing implementations) ====================
    // For brevity, assume they exist as in previous final admin.html.
    // I will include placeholders but you should copy the full functions from the previous message.
    async function renderKyc(){ return `<div>KYC</div>`; }
    async function renderUsers(){ return `<div>Users</div>`; }
    async function renderWithdrawals(){ return `<div>Withdrawals</div>`; }
    async function renderLeaderboard(){ return `<div>Leaderboard</div>`; }
    async function renderFraud(){ return `<div>Fraud</div>`; }
    async function renderChat(){ return `<div>Chat</div>`; }

    let activeTab = 'dashboard';
    async function loadTab(tab){
        activeTab = tab;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');
        const mainDiv = document.getElementById('adminMain');
        if(tab === 'dashboard') mainDiv.innerHTML = await renderDashboard();
        else if(tab === 'tasks') mainDiv.innerHTML = await renderTasks();
        else if(tab === 'submissions') mainDiv.innerHTML = await renderSubmissions();
        else if(tab === 'kyc') mainDiv.innerHTML = await renderKyc();
        else if(tab === 'users') mainDiv.innerHTML = await renderUsers();
        else if(tab === 'withdrawals') mainDiv.innerHTML = await renderWithdrawals();
        else if(tab === 'leaderboard') mainDiv.innerHTML = await renderLeaderboard();
        else if(tab === 'fraud') mainDiv.innerHTML = await renderFraud();
        else if(tab === 'chat') mainDiv.innerHTML = await renderChat();
        attachEvents();
    }

    async function approveSubmission(submissionId, userId, reward, taskId){
        await supabase.from('submissions').update({ status: 'approved' }).eq('id', submissionId);
        const { data: user } = await supabase.from('profiles').select('balance, referred_by').eq('id', userId).single();
        const newBalance = (user.balance || 0) + reward;
        await supabase.from('profiles').update({ balance: newBalance }).eq('id', userId);
        await supabase.from('balance_history').insert({ uid: userId, amount_change: reward, new_balance: newBalance, reason: `Task approval (submission ${submissionId})`, created_by: currentAdmin.id });
        await supabase.from('profiles').update({ total_earnings: supabase.sql`total_earnings + ${reward}` }).eq('id', userId);
        if (user.referred_by) {
            const commission = Math.floor(reward * 0.1);
            if (commission > 0) {
                const { data: referrer } = await supabase.from('profiles').select('balance, total_earnings').eq('id', user.referred_by).single();
                const newRefBal = (referrer.balance || 0) + commission;
                await supabase.from('profiles').update({ balance: newRefBal, total_earnings: (referrer.total_earnings || 0) + commission }).eq('id', user.referred_by);
                await supabase.from('balance_history').insert({ uid: user.referred_by, amount_change: commission, new_balance: newRefBal, reason: `Commission from referred user task`, created_by: currentAdmin.id });
                await supabase.from('referral_commissions').insert({ referrer_uid: user.referred_by, referred_uid: userId, task_earning: reward, commission_amount: commission, task_id: taskId });
            }
        }
        await supabase.from('notifications').insert({ uid: userId, title: 'Task Approved', message: `Your task submission has been approved! You earned ₹${reward}.`, created_at: new Date() });
    }

    function attachEvents(){
        document.getElementById('addTaskBtn')?.addEventListener('click', () => showTaskModal());
        document.querySelectorAll('.editTask').forEach(btn => btn.addEventListener('click', () => showTaskModal(JSON.parse(btn.dataset.task))));
        document.querySelectorAll('.deleteTask').forEach(btn => btn.addEventListener('click', async () => {
            const taskId = btn.dataset.id;
            const confirm = await Swal.fire({ title: 'Delete Task?', text: 'This will delete the task and all submissions.', icon: 'warning', showCancelButton: true });
            if(confirm.isConfirmed){
                const { error } = await supabase.from('tasks').delete().eq('id', taskId);
                if(error) Swal.fire("Error", error.message, "error");
                else { Swal.fire("Deleted", "", "success"); loadTab(activeTab); }
            }
        }));
        document.querySelectorAll('.approveSub').forEach(btn => btn.addEventListener('click', async () => { await approveSubmission(btn.dataset.id, btn.dataset.uid, parseInt(btn.dataset.reward), btn.dataset.taskId); loadTab(activeTab); }));
        document.querySelectorAll('.rejectSub').forEach(btn => btn.addEventListener('click', async () => {
            const { value: feedback } = await Swal.fire({ title: 'Rejection Feedback', input: 'textarea', inputPlaceholder: 'Tell the user why the task was rejected...', showCancelButton: true });
            if(feedback !== undefined){
                await supabase.from('submissions').update({ status: 'rejected', admin_feedback: feedback }).eq('id', btn.dataset.id);
                await supabase.from('notifications').insert({ uid: btn.dataset.uid, title: 'Task Rejected', message: `Your task submission was rejected. Feedback: ${feedback}`, created_at: new Date() });
                loadTab(activeTab);
            }
        }));
        document.querySelectorAll('.requestInfoSub').forEach(btn => btn.addEventListener('click', async () => {
            const { value: msg } = await Swal.fire({ title: 'Request More Info', input: 'textarea', inputPlaceholder: 'What additional details do you need?', showCancelButton: true });
            if(msg) await supabase.from('support_messages').insert({ uid: btn.dataset.uid, recipient_uid: btn.dataset.uid, message: `[Admin Request] ${msg}`, is_admin: true });
            loadTab(activeTab);
        }));
        // (Add other event handlers for KYC, users, withdrawals, fraud, chat as in previous final admin.html)
    }

    document.querySelectorAll('.nav-item[data-tab]').forEach(el => el.addEventListener('click', () => loadTab(el.dataset.tab)));
    document.getElementById('adminLogoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.href = "user.html"; });
    checkAdminAuth();
})();
</script>
</body>
</html>
