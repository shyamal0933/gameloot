<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLoot Admin | Full Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (same styles as previous admin.html) */
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0a0c12;color:#eef2ff;}
        .admin-container{display:flex;min-height:100vh;}
        .sidebar{width:280px;background:rgba(18,22,35,0.85);backdrop-filter:blur(12px);border-right:1px solid rgba(0,255,255,0.2);padding:2rem 1rem;position:fixed;height:100vh;overflow-y:auto;}
        .logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2rem;text-align:center;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 18px;margin:8px 0;border-radius:16px;cursor:pointer;color:#b9c3e6;}
        .nav-item i{width:24px;}
        .nav-item.active,.nav-item:hover{background:rgba(0,242,254,0.15);color:#00f2fe;border-left:3px solid #00f2fe;}
        .main-content{flex:1;margin-left:280px;padding:2rem;}
        .dashboard-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin-bottom:2rem;}
        .card{background:rgba(20,25,45,0.7);backdrop-filter:blur(8px);border:1px solid rgba(0,255,255,0.2);border-radius:28px;padding:1.5rem;}
        .card h3{font-size:1rem;color:#8e9acf;}
        .card .value{font-size:2.2rem;font-weight:700;margin-top:0.5rem;}
        .section-title{font-size:1.4rem;font-weight:600;margin:2rem 0 1rem;border-left:4px solid #00f2fe;padding-left:1rem;}
        table{width:100%;background:rgba(12,16,28,0.7);border-radius:24px;overflow-x:auto;border-collapse:collapse;}
        th,td{padding:14px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.1);}
        th{background:#0f1222;color:#00f2fe;}
        .btn-sm{background:#1e2a47;border:none;padding:6px 12px;border-radius:40px;color:white;cursor:pointer;margin:0 4px;}
        .btn-approve{background:#10b981;}
        .btn-reject{background:#ef4444;}
        .flex-btns{display:flex;gap:6px;flex-wrap:wrap;}
        button{background:linear-gradient(135deg,#00c6fb,#005bea);border:none;padding:10px 20px;border-radius:40px;color:white;font-weight:bold;cursor:pointer;}
        input,textarea,select{background:#1f2937;border:1px solid #374151;padding:10px;border-radius:20px;color:white;width:100%;margin:8px 0;}
        @media (max-width:768px){.sidebar{width:80px;padding:1rem 0.5rem;}.sidebar .logo{font-size:1rem;}.nav-item span{display:none;}.main-content{margin-left:80px;}}
        .kyc-review-card{background:#0f172a;border-radius:24px;padding:1.2rem;margin-bottom:1.2rem;border:1px solid #2a3a5a;}
        .kyc-images-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:15px 0;}
        .kyc-image{background:#00000040;border-radius:16px;padding:8px;text-align:center;}
        .kyc-image img{max-width:100%;max-height:120px;border-radius:12px;cursor:pointer;}
        .debug-info{background:#1e1e2e;border-radius:16px;padding:8px;margin-top:10px;font-size:11px;font-family:monospace;word-break:break-all;}
        .submission-detail{ background:#0f1222; padding:1rem; border-radius:16px; margin:0.5rem 0; }
        .field-value{ margin:0.5rem 0; border-left:2px solid cyan; padding-left:0.8rem; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="logo">🎮 GAMELOOT<br><span style="font-size:12px;">ADMIN</span></div>
        <div class="nav-item active" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
        <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Tasks</span></div>
        <div class="nav-item" data-tab="submissions"><i class="fas fa-clipboard-list"></i><span>Submissions</span></div>
        <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC Reviews</span></div>
        <div class="nav-item" data-tab="users"><i class="fas fa-users"></i><span>Users</span></div>
        <div class="nav-item" data-tab="withdrawals"><i class="fas fa-money-bill-wave"></i><span>Withdrawals</span></div>
        <div class="nav-item" data-tab="chat"><i class="fas fa-comment-dots"></i><span>Support Chat</span></div>
        <div class="nav-item" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>
    <div class="main-content" id="adminMain"></div>
</div>

<script>
(function(){
    const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentAdmin = null;

    async function getSignedUrl(path, expiresIn = 3600) {
        if (!path) return null;
        try { const { data, error } = await supabase.storage.from('kyc_docs').createSignedUrl(path, expiresIn); if (error) return null; return data.signedUrl; } catch(e){ return null; }
    }

    async function checkAdminAuth(){
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "user.html"; return; }
        const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
        if (!profile || !profile.is_admin) {
            await supabase.auth.signOut();
            Swal.fire("Access Denied", "You are not an administrator.", "error");
            window.location.href = "user.html";
            return;
        }
        currentAdmin = user;
        loadTab('dashboard');
    }

    async function fetchStats(){
        const { count: totalUsers } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
        const { count: totalTasks } = await supabase.from('tasks').select('*', { count: 'exact', head: true });
        const { data: submissions } = await supabase.from('submissions').select('reward, status');
        let totalRewards = 0;
        submissions?.forEach(s => { if(s.status === 'approved') totalRewards += s.reward; });
        const { count: pendingKyc } = await supabase.from('verifications').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        const { count: pendingSub } = await supabase.from('submissions').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        return { totalUsers, totalTasks, totalRewards, pendingKyc, pendingSub };
    }

    async function renderDashboard(){
        const s = await fetchStats();
        return `<h2 class="section-title">Analytics</h2><div class="dashboard-cards">
            <div class="card"><h3>Total Users</h3><div class="value">${s.totalUsers||0}</div></div>
            <div class="card"><h3>Total Tasks</h3><div class="value">${s.totalTasks||0}</div></div>
            <div class="card"><h3>Rewards Paid</h3><div class="value">₹${s.totalRewards||0}</div></div>
            <div class="card"><h3>Pending KYC</h3><div class="value">${s.pendingKyc||0}</div></div>
            <div class="card"><h3>Pending Submissions</h3><div class="value">${s.pendingSub||0}</div></div>
        </div>`;
    }

    async function renderTasks(){
        const { data: tasks } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        return `<div style="display:flex; justify-content:space-between;"><h2 class="section-title">Manage Tasks</h2><button id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button></div>
        <table><thead><tr><th>Title</th><th>Reward</th><th>Deadline</th><th>Custom Fields</th><th>Actions</th></tr></thead><tbody>
        ${tasks?.map(t => `<tr>
            <td>${t.title}</td>
            <td>₹${t.reward}</td>
            <td>${t.deadline ? new Date(t.deadline).toLocaleString() : '-'}</td>
            <td>${t.custom_fields?.length || 0} fields</td>
            <td><button class="btn-sm editTask" data-task='${JSON.stringify(t)}'>Edit</button><button class="btn-sm deleteTask" data-id="${t.id}">Delete</button></td>
        </tr>`).join('') || '<tr><td colspan="5">No tasks</td></tr>'}
        </tbody></table>`;
    }

    function showTaskModal(task = null){
        let customFields = task ? task.custom_fields || [] : [];
        Swal.fire({
            title: task ? 'Edit Task' : 'New Task',
            html: `
                <input id="taskTitle" value="${task?.title || ''}" placeholder="Task Title">
                <textarea id="taskDesc" placeholder="Description">${task?.description || ''}</textarea>
                <input id="taskReward" value="${task?.reward || ''}" placeholder="Reward Amount">
                <input id="taskLink" value="${task?.link || ''}" placeholder="Task URL">
                <textarea id="helpText" placeholder="Help text (HTML allowed)">${task?.help_text || ''}</textarea>
                <input id="deadline" type="datetime-local" value="${task?.deadline ? new Date(task.deadline).toISOString().slice(0,16) : ''}" placeholder="Deadline (optional)">
                <div id="customFieldsContainer" class="field-builder" style="background:#0f1222; padding:1rem; border-radius:16px;">
                    <h4>Custom Fields (user must fill)</h4>
                    <div id="fieldsList"></div>
                    <button type="button" id="addFieldBtn" class="btn-sm">+ Add Field</button>
                </div>
            `,
            focusConfirm: false,
            preConfirm: () => {
                const title = document.getElementById('taskTitle').value;
                const description = document.getElementById('taskDesc').value;
                const reward = parseInt(document.getElementById('taskReward').value);
                const link = document.getElementById('taskLink').value;
                const help_text = document.getElementById('helpText').value;
                const deadline = document.getElementById('deadline').value ? new Date(document.getElementById('deadline').value).toISOString() : null;
                const fields = window.tempFields || [];
                if(!title || !reward) Swal.showValidationMessage('Title and reward required');
                return { title, description, reward, link, help_text, deadline, custom_fields: fields };
            },
            didOpen: () => {
                window.tempFields = [...customFields];
                renderFieldsList();
                document.getElementById('addFieldBtn').addEventListener('click', () => {
                    addFieldModal().then(field => { if(field) { window.tempFields.push(field); renderFieldsList(); } });
                });
            },
            width: '800px'
        }).then(async (res) => {
            if(res.value){
                const data = res.value;
                if(task){
                    await supabase.from('tasks').update(data).eq('id', task.id);
                    Swal.fire("Updated", "", "success");
                } else {
                    await supabase.from('tasks').insert({ ...data, created_at: new Date() });
                    Swal.fire("Task added", "", "success");
                }
                loadTab('tasks');
            }
        });
    }

    function renderFieldsList(){
        const container = document.getElementById('fieldsList');
        if(!container) return;
        container.innerHTML = window.tempFields.map((f, idx) => `
            <div style="background:#1a1e2e; padding:0.8rem; margin:0.5rem 0; border-radius:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input type="text" value="${f.label}" placeholder="Label" onchange="window.tempFields[${idx}].label = this.value">
                <select onchange="window.tempFields[${idx}].type = this.value">
                    <option value="text" ${f.type==='text'?'selected':''}>Text</option>
                    <option value="email" ${f.type==='email'?'selected':''}>Email</option>
                    <option value="number" ${f.type==='number'?'selected':''}>Number</option>
                    <option value="file" ${f.type==='file'?'selected':''}>File Upload</option>
                </select>
                <label><input type="checkbox" ${f.required ? 'checked' : ''} onchange="window.tempFields[${idx}].required = this.checked"> Required</label>
                <button class="btn-sm" onclick="window.tempFields.splice(${idx},1); renderFieldsList()">Remove</button>
            </div>
        `).join('');
    }

    async function addFieldModal(){
        const { value: field } = await Swal.fire({
            title: 'Add Custom Field',
            html: `<input id="fieldLabel" placeholder="Field Label"><select id="fieldType"><option value="text">Text</option><option value="email">Email</option><option value="number">Number</option><option value="file">File Upload</option></select><label><input type="checkbox" id="fieldRequired"> Required</label>`,
            preConfirm: () => ({ label: document.getElementById('fieldLabel').value, type: document.getElementById('fieldType').value, required: document.getElementById('fieldRequired').checked })
        });
        if(field && field.label) return field;
        return null;
    }

    async function renderSubmissions(){
        const { data: subs } = await supabase.from('submissions').select('*, tasks(title, custom_fields), profiles(name)').eq('status', 'pending');
        if(!subs?.length) return `<h2 class="section-title">Pending Submissions</h2><p>No pending submissions.</p>`;
        let html = `<h2 class="section-title">Pending Submissions</h2>`;
        for(const s of subs){
            const customFields = s.tasks?.custom_fields || [];
            let submissionHtml = `<div class="submission-detail">
                <strong>User:</strong> ${s.profiles?.name}<br>
                <strong>Task:</strong> ${s.tasks?.title}<br>
                <strong>Submitted Data:</strong><br>`;
            if(s.submission_data){
                for(const field of customFields){
                    const value = s.submission_data[field.label];
                    if(field.type === 'file' && value){
                        const fileUrl = await getSignedUrl(value);
                        submissionHtml += `<div class="field-value"><strong>${field.label}:</strong> <a href="${fileUrl}" target="_blank">View File</a></div>`;
                    } else {
                        submissionHtml += `<div class="field-value"><strong>${field.label}:</strong> ${value || '-'}</div>`;
                    }
                }
            } else {
                submissionHtml += `<div class="field-value">${s.proof || 'No data'}</div>`;
            }
            submissionHtml += `<div class="flex-btns" style="margin-top:1rem;">
                <button class="btn-sm btn-approve approveSub" data-id="${s.id}" data-uid="${s.uid}" data-reward="${s.reward}" data-task-id="${s.task_id}">Approve</button>
                <button class="btn-sm btn-reject rejectSub" data-id="${s.id}">Reject</button>
                <button class="btn-sm requestInfoSub" data-id="${s.id}" data-uid="${s.uid}">Request More Info</button>
            </div></div>`;
            html += submissionHtml;
        }
        return html;
    }

    async function renderKyc(){
        const { data: kycList } = await supabase.from('verifications').select('*').eq('status', 'pending');
        if(!kycList?.length) return `<h2 class="section-title">KYC Reviews</h2><p>No pending KYC requests.</p>`;
        let html = `<h2 class="section-title">KYC Verification Requests</h2>`;
        for(const k of kycList){
            const {data:prof}=await supabase.from('profiles').select('name,email').eq('id',k.uid).single();
            const userName = prof?.name || prof?.email || k.uid;
            const aadFrontUrl = await getSignedUrl(k.aadhaar_front);
            const aadBackUrl = await getSignedUrl(k.aadhaar_back);
            const aadFrontSelfieUrl = await getSignedUrl(k.aadhaar_front_selfie);
            const aadBackSelfieUrl = await getSignedUrl(k.aadhaar_back_selfie);
            const panFrontDocUrl = await getSignedUrl(k.pan_front_doc);
            const panBackDocUrl = await getSignedUrl(k.pan_back_doc);
            const panFrontSelfieUrl = await getSignedUrl(k.pan_front_selfie);
            const panBackSelfieUrl = await getSignedUrl(k.pan_back_selfie);
            const hdPicUrl = await getSignedUrl(k.user_hd_pic);
            html += `<div class="kyc-review-card"><h3>${userName}</h3><p><strong>Aadhaar:</strong> ${k.aadhaar_number||'-'}</p><p><strong>PAN:</strong> ${k.pan_number||'-'}</p>
            <div class="kyc-images-grid">${aadFrontUrl?`<div class="kyc-image"><img src="${aadFrontUrl}"><br>Aadhaar Front</div>`:''}${aadBackUrl?`<div class="kyc-image"><img src="${aadBackUrl}"><br>Aadhaar Back</div>`:''}${aadFrontSelfieUrl?`<div class="kyc-image"><img src="${aadFrontSelfieUrl}"><br>Front Selfie</div>`:''}${aadBackSelfieUrl?`<div class="kyc-image"><img src="${aadBackSelfieUrl}"><br>Back Selfie</div>`:''}${panFrontDocUrl?`<div class="kyc-image"><img src="${panFrontDocUrl}"><br>PAN Front</div>`:''}${panBackDocUrl?`<div class="kyc-image"><img src="${panBackDocUrl}"><br>PAN Back</div>`:''}${panFrontSelfieUrl?`<div class="kyc-image"><img src="${panFrontSelfieUrl}"><br>PAN Front Selfie</div>`:''}${panBackSelfieUrl?`<div class="kyc-image"><img src="${panBackSelfieUrl}"><br>PAN Back Selfie</div>`:''}${hdPicUrl?`<div class="kyc-image"><img src="${hdPicUrl}"><br>HD Pic</div>`:''}</div>
            <div class="flex-btns"><button class="btn-sm btn-approve verifyKyc" data-id="${k.id}" data-uid="${k.uid}">Approve KYC</button><button class="btn-sm btn-reject rejectKyc" data-id="${k.id}">Reject KYC</button></div></div>`;
        }
        return html;
    }

    async function renderUsers(){
        const { data: users } = await supabase.from('profiles').select('*');
        return `<h2 class="section-title">User Management</h2>
        <table><thead><tr><th>Name/Email</th><th>Balance</th><th>KYC</th><th>Fraud Score</th><th>Status</th><th>Actions</th></tr></thead><tbody>
        ${users?.map(u => `<tr>
            <td>${u.name||u.email}<br><small>${u.id}</small></td>
            <td>₹${u.balance||0}</td>
            <td>${u.verification_status||'pending'}</td>
            <td>${u.fraud_score||0}</td>
            <td>${u.account_status||'active'}</td>
            <td class="flex-btns"><button class="btn-sm suspendUser" data-id="${u.id}" data-status="${u.account_status}">${u.account_status==='suspended'?'Unsuspend':'Suspend'}</button><button class="btn-sm btn-reject deleteUser" data-id="${u.id}">Delete</button></td>
        </tr>`).join('')}
        </tbody></table>`;
    }

    async function renderWithdrawals(){
        const { data: wd } = await supabase.from('withdrawals').select('*, profiles(name)').eq('status', 'pending');
        return `<h2 class="section-title">Withdrawals</h2>
        <table><thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Details</th><th>Action</th></tr></thead><tbody>
        ${wd?.map(w => `</td>
            <td>${w.profiles?.name}</td>
            <td>₹${w.amount}</td>
            <td>${w.method}</td>
            <td>${w.details}</td>
            <td><button class="btn-sm btn-approve approveWd" data-id="${w.id}" data-uid="${w.uid}" data-amount="${w.amount}">Approve</button>
            <button class="btn-sm btn-reject rejectWd" data-id="${w.id}">Reject</button></td>
        </tr>`).join('') || '<tr><td colspan="5">No pending withdrawals</td></tr>'}
        </tbody></table>`;
    }

    async function renderChat(){
        const { data: users } = await supabase.from('profiles').select('id, name, email');
        let selectedUserId = localStorage.getItem('selectedChatUserId') || (users?.[0]?.id || '');
        let messages = [];
        if(selectedUserId){
            const { data: msgs } = await supabase.from('support_messages').select('*, profiles!uid(name)').or(`uid.eq.${selectedUserId},recipient_uid.eq.${selectedUserId}`).order('created_at', { ascending: true });
            messages = msgs || [];
        }
        return `<h2 class="section-title">Support Chat (Private per User)</h2>
        <div style="margin-bottom:1rem;"><label>Select User: </label><select id="chatUserSelect">${users?.map(u => `<option value="${u.id}" ${selectedUserId === u.id ? 'selected' : ''}>${u.name || u.email}</option>`).join('')}</select></div>
        <div id="chatMessages" style="height:300px; overflow-y:auto; background:#0f1222; border-radius:24px; padding:1rem; margin-bottom:1rem;">${messages.map(m => `<div><strong>${m.profiles?.name || (m.is_admin ? 'Admin' : 'User')}:</strong> ${m.message}</div>`).join('') || '<div>No messages yet.</div>'}</div>
        <div style="display:flex; gap:10px;"><input type="text" id="adminChatMsg" placeholder="Type your reply..."><button id="sendAdminReply">Send</button></div>`;
    }

    let activeTab = 'dashboard';
    async function loadTab(tab){
        activeTab = tab;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');
        const mainDiv = document.getElementById('adminMain');
        if(tab === 'dashboard') mainDiv.innerHTML = await renderDashboard();
        else if(tab === 'tasks') mainDiv.innerHTML = await renderTasks();
        else if(tab === 'submissions') mainDiv.innerHTML = await renderSubmissions();
        else if(tab === 'kyc') mainDiv.innerHTML = await renderKyc();
        else if(tab === 'users') mainDiv.innerHTML = await renderUsers();
        else if(tab === 'withdrawals') mainDiv.innerHTML = await renderWithdrawals();
        else if(tab === 'chat') mainDiv.innerHTML = await renderChat();
        attachEvents();
    }

    // ---------- Approval with referral handling ----------
    async function approveSubmission(submissionId, userId, reward, taskId){
        // Update submission status
        await supabase.from('submissions').update({ status: 'approved' }).eq('id', submissionId);
        // Get user's current balance
        const { data: user } = await supabase.from('profiles').select('balance, referred_by').eq('id', userId).single();
        const newBalance = (user.balance || 0) + reward;
        await supabase.from('profiles').update({ balance: newBalance }).eq('id', userId);
        await supabase.from('balance_history').insert({ uid: userId, amount_change: reward, new_balance: newBalance, reason: `Task approval (submission ${submissionId})`, created_by: currentAdmin.id });

        // ----- 10% commission for referrer -----
        if (user.referred_by) {
            const commission = Math.floor(reward * 0.1);
            if (commission > 0) {
                const { data: referrer } = await supabase.from('profiles').select('balance').eq('id', user.referred_by).single();
                const newRefBal = (referrer.balance || 0) + commission;
                await supabase.from('profiles').update({ balance: newRefBal }).eq('id', user.referred_by);
                await supabase.from('balance_history').insert({ uid: user.referred_by, amount_change: commission, new_balance: newRefBal, reason: `10% commission from referred user's task (submission ${submissionId})`, created_by: currentAdmin.id });
                await supabase.from('referral_commissions').insert({
                    referrer_uid: user.referred_by,
                    referred_uid: userId,
                    task_earning: reward,
                    commission_amount: commission,
                    task_id: taskId,
                    created_at: new Date()
                });
                Swal.fire("Commission", `Referrer earned ₹${commission} commission.`, "info");
            }
        }
    }

    function attachEvents(){
        document.getElementById('addTaskBtn')?.addEventListener('click', () => showTaskModal());
        document.querySelectorAll('.editTask').forEach(btn => btn.addEventListener('click', () => showTaskModal(JSON.parse(btn.dataset.task))));
        document.querySelectorAll('.deleteTask').forEach(btn => btn.addEventListener('click', async () => { await supabase.from('tasks').delete().eq('id', btn.dataset.id); Swal.fire("Deleted"); loadTab(activeTab); }));
        
        document.querySelectorAll('.approveSub').forEach(btn => btn.addEventListener('click', async () => {
            const id = btn.dataset.id, uid = btn.dataset.uid, reward = parseInt(btn.dataset.reward), taskId = btn.dataset.taskId;
            await approveSubmission(id, uid, reward, taskId);
            loadTab(activeTab);
        }));
        
        document.querySelectorAll('.rejectSub').forEach(btn => btn.addEventListener('click', async () => {
            const { value: reason } = await Swal.fire({ title: 'Rejection Reason', input: 'textarea', inputPlaceholder: 'Why was this task rejected?', showCancelButton: true });
            if(reason){
                await supabase.from('submissions').update({ status: 'rejected', rejection_reason: reason }).eq('id', btn.dataset.id);
                Swal.fire("Rejected with reason", "", "info");
                loadTab(activeTab);
            }
        }));
        
        document.querySelectorAll('.requestInfoSub').forEach(btn => btn.addEventListener('click', async () => {
            const { value: message } = await Swal.fire({ title: 'Request Additional Info', input: 'textarea', inputPlaceholder: 'Ask user to provide more details...', showCancelButton: true });
            if(message){
                await supabase.from('support_messages').insert({ uid: btn.dataset.uid, recipient_uid: btn.dataset.uid, message: `[Admin Request] ${message}`, is_admin: true, created_at: new Date() });
                Swal.fire("Request sent to user via chat", "", "success");
            }
        }));
        
        document.querySelectorAll('.verifyKyc').forEach(btn => btn.addEventListener('click', async () => {
            const kycId = btn.dataset.id;
            const userId = btn.dataset.uid;
            await supabase.from('verifications').update({ status: 'verified' }).eq('id', kycId);
            await supabase.from('profiles').update({ verification_status: 'verified' }).eq('id', userId);

            // ---- KYC Bonus Logic ----
            const { data: user } = await supabase.from('profiles').select('referred_by, kyc_bonus_received, referral_count, balance').eq('id', userId).single();
            
            // Bonus for the user themselves (₹50)
            if (!user.kyc_bonus_received) {
                const newBal = (user.balance || 0) + 50;
                await supabase.from('profiles').update({ balance: newBal, kyc_bonus_received: true }).eq('id', userId);
                await supabase.from('balance_history').insert({ uid: userId, amount_change: 50, new_balance: newBal, reason: 'KYC completion bonus', created_by: currentAdmin.id });
                Swal.fire("Bonus!", "User received ₹50 for KYC completion.", "success");
            }

            // Bonus for referrer (if exists and within limit)
            if (user.referred_by) {
                const { data: referrer } = await supabase.from('profiles').select('referral_kyc_bonus_paid, referral_count, balance').eq('id', user.referred_by).single();
                if (!referrer?.referral_kyc_bonus_paid && (referrer.referral_count || 0) < 100) {
                    const newRefBal = (referrer.balance || 0) + 50;
                    await supabase.from('profiles').update({ 
                        balance: newRefBal, 
                        referral_kyc_bonus_paid: true, 
                        referral_count: (referrer.referral_count || 0) + 1,
                        referral_earnings: (referrer.referral_earnings || 0) + 50
                    }).eq('id', user.referred_by);
                    await supabase.from('balance_history').insert({ uid: user.referred_by, amount_change: 50, new_balance: newRefBal, reason: `Referral bonus for user ${userId} completing KYC`, created_by: currentAdmin.id });
                    Swal.fire("Bonus!", `Referrer received ₹50 for this referral.`, "success");
                } else if ((referrer.referral_count || 0) >= 100) {
                    Swal.fire("Limit reached", "Referrer has reached the maximum 100 referrals.", "warning");
                }
            }
            loadTab(activeTab);
        }));
        
        document.querySelectorAll('.rejectKyc').forEach(btn => btn.addEventListener('click', async () => { await supabase.from('verifications').update({ status: 'rejected' }).eq('id', btn.dataset.id); Swal.fire("Rejected"); loadTab(activeTab); }));
        document.querySelectorAll('.suspendUser').forEach(btn => btn.addEventListener('click', async () => { const newStatus = btn.dataset.status === 'suspended' ? 'active' : 'suspended'; await supabase.from('profiles').update({ account_status: newStatus }).eq('id', btn.dataset.id); Swal.fire(`User ${newStatus}`); loadTab(activeTab); }));
        document.querySelectorAll('.deleteUser').forEach(btn => btn.addEventListener('click', async () => { await supabase.from('profiles').delete().eq('id', btn.dataset.id); Swal.fire("Deleted"); loadTab(activeTab); }));
        document.querySelectorAll('.approveWd').forEach(btn => btn.addEventListener('click', async () => { await supabase.from('withdrawals').update({ status: 'approved' }).eq('id', btn.dataset.id); Swal.fire("Withdrawal Approved"); loadTab(activeTab); }));
        document.querySelectorAll('.rejectWd').forEach(btn => btn.addEventListener('click', async () => { await supabase.from('withdrawals').update({ status: 'rejected' }).eq('id', btn.dataset.id); Swal.fire("Rejected"); loadTab(activeTab); }));
        
        const sendBtn = document.getElementById('sendAdminReply');
        if(sendBtn){
            sendBtn.addEventListener('click', async () => {
                const msg = document.getElementById('adminChatMsg').value;
                const selectedUserId = document.getElementById('chatUserSelect')?.value;
                if(!msg || !selectedUserId) return Swal.fire("Error", "Select user and enter message", "warning");
                await supabase.from('support_messages').insert({ uid: currentAdmin.id, recipient_uid: selectedUserId, message: msg, is_admin: true, created_at: new Date() });
                document.getElementById('adminChatMsg').value = '';
                loadTab('chat');
            });
        }
        const userSelect = document.getElementById('chatUserSelect');
        if(userSelect){
            userSelect.addEventListener('change', (e) => { localStorage.setItem('selectedChatUserId', e.target.value); loadTab('chat'); });
        }
    }

    document.querySelectorAll('.nav-item[data-tab]').forEach(el => el.addEventListener('click', () => loadTab(el.dataset.tab)));
    document.getElementById('adminLogoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.href = "user.html"; });
    checkAdminAuth();
})();
</script>
</body>
</html>
