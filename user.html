<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLoot | Earn Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0b0e17;color:#eef5ff;}
        .app-wrapper{display:flex;min-height:100vh;}
        .sidebar{width:280px;background:rgba(15,20,35,0.9);backdrop-filter:blur(16px);border-right:1px solid rgba(0,242,254,0.25);padding:2rem 1rem;position:fixed;height:100vh;}
        .logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2rem;text-align:center;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:6px 0;border-radius:40px;cursor:pointer;color:#a0abcf;}
        .nav-item i{width:26px;}
        .nav-item.active,.nav-item:hover{background:rgba(0,242,254,0.12);color:#00f2fe;}
        .main-panel{flex:1;margin-left:280px;padding:2rem;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2rem;margin-bottom:2rem;}
        .stat-card{background:rgba(20,28,45,0.65);backdrop-filter:blur(8px);border-radius:28px;padding:1.2rem;border:1px solid rgba(0,255,255,0.2);}
        .stat-card h4{font-size:0.8rem;color:#8e9acf;}
        .stat-card .value{font-size:2rem;font-weight:700;margin-top:8px;}
        .tasks-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;margin-top:1rem;}
        .task-card{background:#111827;border-radius:28px;padding:1.2rem;border:1px solid #2a3448;}
        .task-card h3{font-size:1.2rem;}
        .reward-badge{background:#00f2fe20;color:#00f2fe;padding:4px 12px;border-radius:40px;display:inline-block;margin:8px 0;}
        button{background:linear-gradient(95deg,#0055ff,#00c3ff);border:none;padding:8px 18px;border-radius:40px;color:white;font-weight:600;cursor:pointer;}
        .referral-box{background:#0a0f1c;border-radius:20px;padding:1rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
        @media (max-width:760px){.sidebar{width:80px;}.sidebar span{display:none;}.main-panel{margin-left:80px;}}
        .status-badge{padding:2px 12px;border-radius:40px;font-size:0.7rem;background:#334155;}
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar">
        <div class="logo">🎮 GAMELOOT</div>
        <div class="nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div>
        <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Earn Tasks</span></div>
        <div class="nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Referrals</span></div>
        <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
        <div class="nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
        <div class="nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Support</span></div>
        <div class="nav-item" id="userLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>
    <div class="main-panel" id="userMainPanel"></div>
</div>
<script>
    (function() {
        // ==================== YOUR SUPABASE CREDENTIALS ====================
        const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
        // ====================================================================
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let userProfile = null;
        
        function toast(msg, icon='info') {
            Swal.fire({ toast: true, position: 'top-end', icon, title: msg, showConfirmButton: false, timer: 3000 });
        }
        
        async function ensureProfileExists(userId, email) {
            // Check if profile exists
            let { data: profile } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (!profile) {
                // Create profile with a unique referral code
                const referralCode = 'GL' + Math.random().toString(36).substring(2,8).toUpperCase();
                const newProfile = {
                    id: userId,
                    email: email,
                    name: email.split('@')[0],
                    balance: 0,
                    verification_status: 'pending',
                    referral_code: referralCode,
                    total_referrals: 0,
                    referral_earnings: 0,
                    fraud_score: 0,
                    account_status: 'active',
                    is_admin: false,
                    created_at: new Date()
                };
                const { error } = await supabase.from('profiles').insert(newProfile);
                if (error) {
                    console.error("Profile creation error:", error);
                    toast("Error creating profile. Please contact support.", "error");
                    return null;
                }
                profile = newProfile;
            }
            return profile;
        }
        
        async function checkAuthAndLoad() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                showAuthModal();
                return;
            }
            currentUser = user;
            // Wait for email verification
            if (!user.email_confirmed_at) {
                await supabase.auth.signOut();
                Swal.fire("Email Not Verified", "Please verify your email before accessing tasks.", "error");
                showAuthModal();
                return;
            }
            // Ensure profile exists
            userProfile = await ensureProfileExists(user.id, user.email);
            if (!userProfile) return;
            
            // Handle referral from URL
            const refCode = new URLSearchParams(window.location.search).get('ref');
            if (refCode && !userProfile.referred_by) {
                await supabase.from('profiles').update({ referred_by: refCode }).eq('id', user.id);
                toast("Referral code applied! Bonus after conditions.", "success");
            }
            renderPanel('dashboard');
        }
        
        async function renderDashboard() {
            const { data: submissions } = await supabase.from('submissions').select('status').eq('uid', currentUser.id);
            const total = submissions?.length || 0;
            const completed = submissions?.filter(s => s.status === 'approved').length || 0;
            return `
                <h2>Welcome, ${userProfile.name || 'Explorer'} 🎯</h2>
                <div class="stats-grid">
                    <div class="stat-card"><h4>💰 Balance</h4><div class="value">₹${userProfile.balance || 0}</div></div>
                    <div class="stat-card"><h4>✅ KYC</h4><div class="value">${userProfile.verification_status?.toUpperCase()}</div></div>
                    <div class="stat-card"><h4>📋 Total Tasks</h4><div class="value">${total}</div></div>
                    <div class="stat-card"><h4>✔️ Completed</h4><div class="value">${completed}</div></div>
                    <div class="stat-card"><h4>👥 Referrals</h4><div class="value">${userProfile.total_referrals || 0}</div></div>
                    <div class="stat-card"><h4>🏆 Referral Earn</h4><div class="value">₹${userProfile.referral_earnings || 0}</div></div>
                </div>
                <div class="referral-box">
                    <span><i class="fas fa-link"></i> Your Code: <strong>${userProfile.referral_code}</strong></span>
                    <button id="copyCodeBtn">Copy Code</button>
                    <button id="copyLinkBtn">Copy Referral Link</button>
                </div>
            `;
        }
        
        async function renderTasks() {
            const { data: tasks } = await supabase.from('tasks').select('*');
            return `
                <h2>Available Tasks</h2>
                <div class="tasks-container">
                    ${tasks?.map(task => `
                        <div class="task-card">
                            <h3>${task.title}</h3>
                            <p>${task.description}</p>
                            <div class="reward-badge">+₹${task.reward}</div>
                            <p>${task.category}</p>
                            <button class="visitTaskBtn" data-link="${task.link}">Visit</button>
                            <button class="completeTaskBtn" data-id="${task.id}" data-reward="${task.reward}">Complete Task</button>
                        </div>
                    `).join('') || '<p>No tasks yet. Admin will add soon.</p>'}
                </div>
            `;
        }
        
        async function renderReferrals() {
            const link = `${window.location.origin}${window.location.pathname}?ref=${userProfile.referral_code}`;
            return `
                <h2>Referral Program</h2>
                <div class="referral-box" style="flex-direction:column; align-items:start;">
                    <div>🔗 ${link}</div>
                    <button id="copyFullLinkBtn">Copy Link</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><h4>Total Referrals</h4><div class="value">${userProfile.total_referrals || 0}</div></div>
                    <div class="stat-card"><h4>Referral Earnings</h4><div class="value">₹${userProfile.referral_earnings || 0}</div></div>
                </div>
                <p class="status-badge">⚠️ Bonus after referred user: email verified, KYC, 3 tasks, account >24h.</p>
            `;
        }
        
        async function renderKyc() {
            const { data: existing } = await supabase.from('verifications').select('*').eq('uid', currentUser.id).single();
            if (existing?.status === 'verified') return `<h2>KYC Status</h2><div class="stat-card">✅ Verified! You can withdraw.</div>`;
            if (existing?.status === 'pending') return `<h2>KYC Status</h2><div class="stat-card">⏳ Under review.</div>`;
            return `
                <h2>Complete KYC (Mandatory for Withdrawal)</h2>
                <div style="max-width:500px">
                    <input type="text" id="fullName" placeholder="Full Name as per Aadhaar">
                    <input type="text" id="aadhaarNum" placeholder="Aadhaar Number">
                    <input type="text" id="panNum" placeholder="PAN Number">
                    <label>Aadhaar Front</label><input type="file" id="aadhaarFront" accept="image/*">
                    <label>Aadhaar Back</label><input type="file" id="aadhaarBack" accept="image/*">
                    <label>PAN Card</label><input type="file" id="panFront" accept="image/*">
                    <label>Selfie holding Aadhaar + PAN</label><input type="file" id="holdingSelfie" accept="image/*">
                    <button id="submitKycBtn">Submit Verification</button>
                </div>
            `;
        }
        
        async function renderWithdraw() {
            if (userProfile.verification_status !== 'verified') {
                return `<h2>Withdrawal Blocked</h2><div class="stat-card">⚠️ Complete KYC first.</div>`;
            }
            return `
                <h2>Withdraw Funds</h2>
                <form id="wdForm">
                    <input type="number" id="wdAmount" placeholder="Amount (Min ₹100)" required>
                    <select id="wdMethod">
                        <option>UPI</option>
                        <option>Bank Transfer</option>
                        <option>Crypto</option>
                    </select>
                    <input id="wdDetails" placeholder="UPI ID / Account / Wallet Address" required>
                    <button type="submit">Request Withdrawal</button>
                </form>
            `;
        }
        
        async function renderChat() {
            const { data: msgs } = await supabase.from('support_messages').select('*').or(`uid.eq.${currentUser.id},is_admin.eq.true`).order('created_at');
            return `
                <h2>Support Chat</h2>
                <div id="chatBox" style="height:250px; overflow-y:auto; background:#0f1222; border-radius:20px; padding:1rem;">
                    ${msgs?.map(m => `<div><strong>${m.is_admin ? 'Admin' : 'You'}:</strong> ${m.message}</div>`).join('')}
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="userChatMsg" placeholder="Type message...">
                    <button id="sendMsgBtn">Send</button>
                </div>
            `;
        }
        
        let currentTab = 'dashboard';
        async function renderPanel(tab) {
            currentTab = tab;
            const container = document.getElementById('userMainPanel');
            if (tab === 'dashboard') container.innerHTML = await renderDashboard();
            else if (tab === 'tasks') container.innerHTML = await renderTasks();
            else if (tab === 'referrals') container.innerHTML = await renderReferrals();
            else if (tab === 'kyc') container.innerHTML = await renderKyc();
            else if (tab === 'withdraw') container.innerHTML = await renderWithdraw();
            else if (tab === 'chat') container.innerHTML = await renderChat();
            attachEvents();
        }
        
        function attachEvents() {
            document.getElementById('copyCodeBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(userProfile.referral_code);
                toast("Referral code copied!");
            });
            document.getElementById('copyLinkBtn')?.addEventListener('click', () => {
                const link = `${location.origin}${location.pathname}?ref=${userProfile.referral_code}`;
                navigator.clipboard.writeText(link);
                toast("Referral link copied!");
            });
            document.getElementById('copyFullLinkBtn')?.addEventListener('click', () => {
                const link = `${location.origin}${location.pathname}?ref=${userProfile.referral_code}`;
                navigator.clipboard.writeText(link);
                toast("Link copied!");
            });
            document.querySelectorAll('.visitTaskBtn').forEach(btn => {
                btn.addEventListener('click', () => window.open(btn.dataset.link, '_blank'));
            });
            document.querySelectorAll('.completeTaskBtn').forEach(btn => {
                btn.addEventListener('click', () => showSubmissionPopup(btn.dataset.id, btn.dataset.reward));
            });
            document.getElementById('submitKycBtn')?.addEventListener('click', async (e) => {
                e.preventDefault();
                await uploadKyc();
            });
            document.getElementById('wdForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const amount = parseInt(document.getElementById('wdAmount').value);
                if (amount < 100) return toast("Minimum withdrawal is ₹100", "error");
                await supabase.from('withdrawals').insert({
                    uid: currentUser.id,
                    amount: amount,
                    method: document.getElementById('wdMethod').value,
                    details: document.getElementById('wdDetails').value,
                    status: 'pending',
                    created_at: new Date()
                });
                toast("Withdrawal request sent!", "success");
                renderPanel('withdraw');
            });
            document.getElementById('sendMsgBtn')?.addEventListener('click', async () => {
                const msg = document.getElementById('userChatMsg').value;
                if (!msg) return;
                await supabase.from('support_messages').insert({
                    uid: currentUser.id,
                    message: msg,
                    is_admin: false,
                    created_at: new Date()
                });
                document.getElementById('userChatMsg').value = '';
                renderPanel('chat');
            });
        }
        
        async function showSubmissionPopup(taskId, reward) {
            const result = await Swal.fire({
                title: 'Submit Proof',
                html: `
                    <textarea id="proofText" placeholder="Write completion proof or screenshot URL..."></textarea>
                    <input id="proofUrl" placeholder="Screenshot URL (optional)">
                `,
                preConfirm: () => ({
                    text: document.getElementById('proofText').value,
                    url: document.getElementById('proofUrl').value
                })
            });
            if (result.value) {
                const proof = result.value.url || result.value.text;
                if (!proof) return toast("Please provide proof", "error");
                await supabase.from('submissions').insert({
                    uid: currentUser.id,
                    task_id: taskId,
                    proof: proof,
                    status: 'pending',
                    reward: parseInt(reward),
                    created_at: new Date()
                });
                toast("Task submitted for review!", "success");
                renderPanel('tasks');
            }
        }
        
        async function uploadKyc() {
            const fullName = document.getElementById('fullName').value;
            const aadhaarNum = document.getElementById('aadhaarNum').value;
            const panNum = document.getElementById('panNum').value;
            const aadFront = document.getElementById('aadhaarFront').files[0];
            const aadBack = document.getElementById('aadhaarBack').files[0];
            const panFront = document.getElementById('panFront').files[0];
            const selfie = document.getElementById('holdingSelfie').files[0];
            
            if (!fullName || !aadhaarNum || !panNum) return toast("Please fill all fields", "error");
            if (!aadFront || !aadBack || !panFront || !selfie) return toast("Please upload all images", "error");
            
            const uploadFile = async (file, path) => {
                const { data, error } = await supabase.storage.from('kyc_docs').upload(`${currentUser.id}/${path}`, file);
                if (error) throw error;
                return data?.path;
            };
            
            try {
                const frontUrl = await uploadFile(aadFront, 'aadhar_front');
                const backUrl = await uploadFile(aadBack, 'aadhar_back');
                const panUrl = await uploadFile(panFront, 'pan');
                const selfieUrl = await uploadFile(selfie, 'selfie');
                
                await supabase.from('verifications').insert({
                    uid: currentUser.id,
                    full_name: fullName,
                    aadhaar_number: aadhaarNum,
                    pan_number: panNum,
                    aadhaar_front: frontUrl,
                    aadhaar_back: backUrl,
                    pan_front: panUrl,
                    holding_selfie: selfieUrl,
                    status: 'pending',
                    submitted_at: new Date()
                });
                toast("KYC submitted for verification", "success");
                renderPanel('kyc');
            } catch (err) {
                console.error(err);
                toast("Upload failed. Ensure storage bucket 'kyc_docs' exists.", "error");
            }
        }
        
        function showAuthModal() {
            Swal.fire({
                title: 'GameLoot',
                html: `
                    <input id="authEmail" placeholder="Email" class="swal2-input">
                    <input id="authPass" type="password" placeholder="Password" class="swal2-input">
                    <select id="authMode" class="swal2-select">
                        <option value="login">Login</option>
                        <option value="signup">Sign Up</option>
                    </select>
                `,
                preConfirm: () => ({
                    email: document.getElementById('authEmail').value,
                    pass: document.getElementById('authPass').value,
                    mode: document.getElementById('authMode').value
                }),
                allowOutsideClick: false
            }).then(async (res) => {
                if (!res.value) return;
                const { email, pass, mode } = res.value;
                if (mode === 'signup') {
                    const { error } = await supabase.auth.signUp({ email, password: pass });
                    if (error) toast(error.message, "error");
                    else toast("Verification email sent! Check your inbox (and spam).", "info");
                } else {
                    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                    if (error) toast(error.message, "error");
                    else location.reload();
                }
            });
        }
        
        document.getElementById('userLogoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            location.reload();
        });
        
        document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
                renderPanel(el.dataset.tab);
            });
        });
        
        checkAuthAndLoad();
    })();
</script>
</body>
</html>
