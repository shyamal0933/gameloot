<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GameLoot | Earn Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0b0e17; color:#eef5ff; padding-bottom:70px; }
        .sidebar { position:fixed; top:0; left:0; width:280px; height:100vh; background:rgba(15,20,35,0.95); backdrop-filter:blur(16px); border-right:1px solid rgba(0,242,254,0.25); padding:2rem 1rem; z-index:100; transition:transform 0.3s; overflow-y:auto; }
        .logo { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#00f2fe,#4facfe); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:2rem; text-align:center; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:12px 20px; margin:6px 0; border-radius:40px; cursor:pointer; color:#a0abcf; transition:0.2s; }
        .nav-item i { width:26px; }
        .nav-item.active,.nav-item:hover { background:rgba(0,242,254,0.12); color:#00f2fe; }
        .main-panel { margin-left:280px; padding:2rem; transition:margin 0.3s; }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(10,14,23,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(0,242,254,0.3); padding:10px 16px; justify-content:space-around; z-index:200; }
        .bottom-nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; color:#8e9acf; font-size:0.7rem; cursor:pointer; padding:6px 12px; border-radius:30px; }
        .bottom-nav-item i { font-size:1.4rem; }
        .bottom-nav-item.active { color:#00f2fe; background:rgba(0,242,254,0.1); }
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); }
            .main-panel { margin-left:0; padding:1rem 1rem 80px 1rem; }
            .bottom-nav { display:flex; }
        }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:2rem; }
        .stat-card { background:rgba(20,28,45,0.7); backdrop-filter:blur(8px); border-radius:28px; padding:1.2rem; border:1px solid rgba(0,255,255,0.2); transition:0.2s; }
        .stat-card:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,242,254,0.1); }
        .stat-card h4 { font-size:0.8rem; color:#8e9acf; margin-bottom:8px; }
        .stat-card .value { font-size:1.8rem; font-weight:700; }
        .tasks-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.2rem; margin-top:1rem; }
        .task-card { background:#111827; border-radius:28px; padding:1.2rem; border:1px solid #2a3448; transition:0.2s; }
        .task-card:hover { border-color:#00f2fe; transform:scale(1.01); }
        .reward-badge { background:rgba(0,242,254,0.15); color:#00f2fe; padding:4px 12px; border-radius:40px; display:inline-block; margin:8px 0; font-weight:600; }
        button { background:linear-gradient(95deg,#0055ff,#00c3ff); border:none; padding:10px 20px; border-radius:40px; color:white; font-weight:600; cursor:pointer; transition:0.2s; }
        button:active { transform:scale(0.96); }
        .referral-box { background:#0a0f1c; border-radius:20px; padding:1rem; margin-top:1rem; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .kyc-card { background:rgba(12,18,28,0.8); border-radius:32px; padding:1.2rem; margin-bottom:1.5rem; border:1px solid #2a3a5a; }
        .dropdown-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px; background:#0a0f1a; border-radius:60px; margin-bottom:1rem; }
        .dropdown-content { display:none; padding:0.5rem 0; }
        .dropdown-content.open { display:block; }
        .file-group { margin-bottom:1rem; background:#131c2c; padding:10px; border-radius:20px; }
        .file-group label { display:block; margin-bottom:5px; font-weight:500; }
        input, textarea, select { background:#1e293b; border:1px solid #334155; border-radius:28px; padding:12px; width:100%; color:white; }
        .image-preview { width:70px; height:70px; object-fit:cover; border-radius:12px; margin-top:8px; border:1px solid cyan; }
        .chat-box { height:280px; overflow-y:auto; background:#0f1222; border-radius:24px; padding:1rem; margin-bottom:1rem; }
        .payment-method-card { background:#0f172a; border-radius:20px; padding:1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
        .payment-badge { background:#00f2fe20; color:#00f2fe; padding:4px 12px; border-radius:40px; font-size:0.8rem; }
        .btn-sm { padding:6px 12px; font-size:0.8rem; background:#1e2a47; }
        .btn-danger { background:#ef4444; }
    </style>
</head>
<body>

<!-- Desktop Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="logo">🎮 GAMELOOT</div>
    <div class="nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div>
    <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Earn Tasks</span></div>
    <div class="nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Referrals</span></div>
    <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
    <div class="nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
    <div class="nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Support</span></div>
    <div class="nav-item" id="userLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
</div>

<!-- Mobile Bottom Nav -->
<div class="bottom-nav" id="bottomNav">
    <div class="bottom-nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Home</span></div>
    <div class="bottom-nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Tasks</span></div>
    <div class="bottom-nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Refer</span></div>
    <div class="bottom-nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
    <div class="bottom-nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
    <div class="bottom-nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Chat</span></div>
</div>

<div class="main-panel" id="userMainPanel"></div>

<script>
(function(){
    const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, userProfile = null;

    function toast(msg, icon='info'){ Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:3000}); }

    async function ensureProfile(userId, email){
        let { data: profile, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (error && error.code === 'PGRST116') {
            const newProfile = {
                id: userId,
                email: email,
                name: email.split('@')[0],
                balance: 0,
                verification_status: 'pending',
                referral_code: 'GL' + Math.random().toString(36).substring(2,8).toUpperCase(),
                total_referrals: 0,
                referral_earnings: 0,
                fraud_score: 0,
                account_status: 'active',
                is_admin: false,
                created_at: new Date()
            };
            const { data: inserted, error: insertError } = await supabase.from('profiles').insert(newProfile).select().single();
            if (insertError) throw insertError;
            profile = inserted;
        } else if (error) throw error;
        return profile;
    }

    async function checkAuth(){
        const { data: { user } } = await supabase.auth.getUser();
        if(!user){ showAuthModal(); return; }
        currentUser = user;
        if(!user.email_confirmed_at){
            await supabase.auth.signOut();
            Swal.fire("Email Not Verified","Please verify your email.","error");
            showAuthModal(); return;
        }
        try {
            userProfile = await ensureProfile(user.id, user.email);
        } catch(err) {
            toast("Profile error. Please log out and log in again.", "error");
            return;
        }
        const ref = new URLSearchParams(window.location.search).get('ref');
        if(ref && !userProfile.referred_by){
            await supabase.from('profiles').update({ referred_by: ref }).eq('id', user.id);
            toast("Referral code applied!","success");
        }
        renderPanel('dashboard');
    }

    // ---------- Dashboard ----------
    async function renderDashboard(){
        const { data: submissions } = await supabase.from('submissions').select('status').eq('uid', currentUser.id);
        const total = submissions?.length || 0;
        const completed = submissions?.filter(s => s.status === 'approved').length || 0;
        return `
        <div style="margin-bottom:1rem;"><h2>Welcome, ${userProfile.name || 'Explorer'} 🎯</h2></div>
        <div class="stats-grid">
            <div class="stat-card"><h4>💰 Balance</h4><div class="value">₹${userProfile.balance||0}</div></div>
            <div class="stat-card"><h4>✅ KYC</h4><div class="value">${userProfile.verification_status?.toUpperCase()}</div></div>
            <div class="stat-card"><h4>📋 Tasks</h4><div class="value">${total}</div></div>
            <div class="stat-card"><h4>✔️ Done</h4><div class="value">${completed}</div></div>
            <div class="stat-card"><h4>👥 Referrals</h4><div class="value">${userProfile.total_referrals||0}</div></div>
            <div class="stat-card"><h4>🏆 Referral Earn</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div>
        </div>
        <div class="referral-box">
            <span><i class="fas fa-link"></i> Your Code: <strong>${userProfile.referral_code}</strong></span>
            <button id="copyCodeBtn" class="btn-sm">Copy Code</button>
            <button id="copyLinkBtn" class="btn-sm">Copy Link</button>
        </div>`;
    }

    // ---------- Tasks ----------
    async function renderTasks(){
        const { data: tasks } = await supabase.from('tasks').select('*');
        return `<h2>🔥 Available Tasks</h2>
        <div class="tasks-container">
            ${tasks?.map(t => `
                <div class="task-card">
                    <h3>${t.title}</h3>
                    <p>${t.description}</p>
                    <div class="reward-badge">+₹${t.reward}</div>
                    <p><i class="fas fa-tag"></i> ${t.category}</p>
                    <div style="display:flex; gap:8px; margin-top:12px;">
                        <button class="visitTaskBtn" data-link="${t.link}">Visit</button>
                        <button class="completeTaskBtn" data-id="${t.id}" data-reward="${t.reward}">Complete</button>
                    </div>
                </div>
            `).join('') || '<p>No tasks yet. Admin will add soon.</p>'}
        </div>`;
    }

    // ---------- Referrals ----------
    async function renderReferrals(){
        const link = `${location.origin}${location.pathname}?ref=${userProfile.referral_code}`;
        return `<h2>👥 Referral Program</h2>
        <div class="referral-box" style="flex-direction:column; align-items:start;">
            <div>🔗 ${link}</div>
            <button id="copyFullLinkBtn" class="btn-sm">Copy Link</button>
        </div>
        <div class="stats-grid" style="margin-top:1rem;">
            <div class="stat-card"><h4>Total Referrals</h4><div class="value">${userProfile.total_referrals||0}</div></div>
            <div class="stat-card"><h4>Earnings</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div>
        </div>
        <p class="status-badge" style="background:#334155; padding:8px; border-radius:40px; font-size:0.8rem;">⚠️ Bonus after referred user verifies email, KYC, completes 3 tasks & account >24h.</p>`;
    }

    // ---------- KYC ----------
    async function renderKyc(){
        const { data: existing } = await supabase.from('verifications').select('*').eq('uid', currentUser.id).order('submitted_at', { ascending: false }).limit(1).maybeSingle();
        if(existing?.status === 'verified') return `<h2>KYC Status</h2><div class="stat-card">✅ Verified! You can withdraw.</div>`;
        if(existing?.status === 'pending') return `<h2>KYC Status</h2><div class="stat-card">⏳ Under review.</div>`;
        return `
        <h2>📄 Complete KYC (Mandatory)</h2>
        <form id="kycModernForm">
            <div class="kyc-card">
                <div class="dropdown-header" data-dropdown="aadhaar">
                    <h3><i class="fas fa-id-card"></i> Aadhaar Verification</h3>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div id="aadhaarContent" class="dropdown-content">
                    <input type="text" id="aadhaarNum" placeholder="Aadhaar Number (12 digits)" required>
                    <div class="file-group"><label>Aadhaar Front (Document)</label><input type="file" id="aadFrontDoc" accept="image/jpeg,image/png,image/jpg"><img id="previewAadFront" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Back (Document)</label><input type="file" id="aadBackDoc" accept="image/jpeg,image/png,image/jpg"><img id="previewAadBack" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Front Selfie (holding phone)</label><input type="file" id="aadFrontSelfie" accept="image/jpeg,image/png,image/jpg"><img id="previewAadFrontSelfie" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Back Selfie (holding phone)</label><input type="file" id="aadBackSelfie" accept="image/jpeg,image/png,image/jpg"><img id="previewAadBackSelfie" class="image-preview" style="display:none;"></div>
                </div>
            </div>
            <div class="kyc-card">
                <div class="dropdown-header" data-dropdown="pan">
                    <h3><i class="fas fa-credit-card"></i> PAN Card Verification</h3>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div id="panContent" class="dropdown-content">
                    <input type="text" id="panNum" placeholder="PAN Number (e.g., ABCDE1234F)" required>
                    <div class="file-group"><label>PAN Front Document</label><input type="file" id="panFrontDoc" accept="image/jpeg,image/png,image/jpg"><img id="previewPanFront" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Back Document (if any)</label><input type="file" id="panBackDoc" accept="image/jpeg,image/png,image/jpg"><img id="previewPanBack" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Front Selfie (holding PAN card)</label><input type="file" id="panFrontSelfie" accept="image/jpeg,image/png,image/jpg"><img id="previewPanFrontSelfie" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Back Selfie</label><input type="file" id="panBackSelfie" accept="image/jpeg,image/png,image/jpg"><img id="previewPanBackSelfie" class="image-preview" style="display:none;"></div>
                </div>
            </div>
            <div class="kyc-card">
                <h3><i class="fas fa-camera"></i> HD Profile Picture</h3>
                <div class="file-group"><label>High Resolution Photo (clear face)</label><input type="file" id="hdProfilePic" accept="image/jpeg,image/png,image/jpg"><img id="previewHd" class="image-preview" style="display:none;"></div>
            </div>
            <button type="button" id="submitModernKyc">Submit All Documents</button>
        </form>`;
    }

    async function uploadFile(file, baseName){
        if(!file) return null;
        const timestamp = Date.now();
        const ext = file.name.split('.').pop();
        const fileName = `${baseName}_${timestamp}.${ext}`;
        const fullPath = `${currentUser.id}/kyc/${fileName}`;
        const { data, error } = await supabase.storage.from('kyc_docs').upload(fullPath, file, { upsert: false });
        if(error) throw error;
        return fullPath;
    }

    async function submitModernKyc(){
        if (!userProfile) {
            try { userProfile = await ensureProfile(currentUser.id, currentUser.email); }
            catch(e) { toast("Profile setup failed. Please log out and log in again.", "error"); return; }
        }
        const aadhaarNum = document.getElementById('aadhaarNum').value;
        const panNum = document.getElementById('panNum').value;
        if(!aadhaarNum || !panNum) return toast("Aadhaar and PAN numbers required","error");
        const aadFrontDoc = document.getElementById('aadFrontDoc').files[0];
        const aadBackDoc = document.getElementById('aadBackDoc').files[0];
        const aadFrontSelfie = document.getElementById('aadFrontSelfie').files[0];
        const aadBackSelfie = document.getElementById('aadBackSelfie').files[0];
        const panFrontDoc = document.getElementById('panFrontDoc').files[0];
        const panBackDoc = document.getElementById('panBackDoc').files[0];
        const panFrontSelfie = document.getElementById('panFrontSelfie').files[0];
        const panBackSelfie = document.getElementById('panBackSelfie').files[0];
        const hdPic = document.getElementById('hdProfilePic').files[0];
        if(!aadFrontDoc||!aadBackDoc||!aadFrontSelfie||!aadBackSelfie) return toast("All Aadhaar images required","error");
        if(!panFrontDoc||!panFrontSelfie) return toast("PAN front document and selfie required","error");
        if(!hdPic) return toast("HD profile picture required","error");
        toast("Uploading documents...","info");
        try {
            const aadFrontUrl = await uploadFile(aadFrontDoc, 'aad_front_doc');
            const aadBackUrl = await uploadFile(aadBackDoc, 'aad_back_doc');
            const aadFrontSelfieUrl = await uploadFile(aadFrontSelfie, 'aad_front_selfie');
            const aadBackSelfieUrl = await uploadFile(aadBackSelfie, 'aad_back_selfie');
            const panFrontUrl = await uploadFile(panFrontDoc, 'pan_front_doc');
            const panBackUrl = panBackDoc ? await uploadFile(panBackDoc, 'pan_back_doc') : null;
            const panFrontSelfieUrl = await uploadFile(panFrontSelfie, 'pan_front_selfie');
            const panBackSelfieUrl = panBackSelfie ? await uploadFile(panBackSelfie, 'pan_back_selfie') : null;
            const hdUrl = await uploadFile(hdPic, 'hd_profile');
            const { error } = await supabase.from('verifications').insert({
                uid: currentUser.id,
                full_name: userProfile.name,
                aadhaar_number: aadhaarNum,
                aadhaar_front: aadFrontUrl,
                aadhaar_back: aadBackUrl,
                aadhaar_front_selfie: aadFrontSelfieUrl,
                aadhaar_back_selfie: aadBackSelfieUrl,
                pan_number: panNum,
                pan_front_doc: panFrontUrl,
                pan_back_doc: panBackUrl,
                pan_front_selfie: panFrontSelfieUrl,
                pan_back_selfie: panBackSelfieUrl,
                user_hd_pic: hdUrl,
                status: 'pending',
                submitted_at: new Date()
            });
            if(error) throw error;
            toast("KYC submitted successfully! Pending review.","success");
            renderPanel('kyc');
        } catch(err) {
            console.error(err);
            toast("Upload failed: " + err.message, "error");
        }
    }

    // ---------- Withdrawal with Add Bank/UPI, then KYC check on request ----------
    async function renderWithdraw(){
        // Fetch user's payment methods
        const { data: methods, error } = await supabase.from('payment_methods').select('*').eq('uid', currentUser.id);
        if(error) console.error(error);

        return `
        <h2>💸 Withdraw Funds</h2>
        <div class="stats-grid" style="grid-template-columns:1fr 1fr;">
            <div class="stat-card"><h4>Your Balance</h4><div class="value">₹${userProfile.balance||0}</div></div>
            <div class="stat-card"><h4>Min Withdrawal</h4><div class="value">₹100</div></div>
        </div>

        <h3>Your Bank/UPI Accounts</h3>
        <div id="paymentMethodsList">
            ${methods?.length ? methods.map(m => {
                let displayDetails = m.details;
                if(m.type === 'bank') {
                    try {
                        const bankData = JSON.parse(m.details);
                        displayDetails = `${bankData.name} | ${bankData.account} | IFSC: ${bankData.ifsc}`;
                    } catch(e) {}
                }
                return `
                <div class="payment-method-card" data-id="${m.id}">
                    <div><span class="payment-badge">${m.type.toUpperCase()}</span><br><small>${displayDetails}</small></div>
                    <div>
                        <button class="btn-sm btn-danger deleteMethod" data-id="${m.id}">Delete</button>
                    </div>
                </div>`;
            }).join('') : '<p>No payment methods added. Click below to add.</p>'}
        </div>

        <button id="addPaymentMethodBtn" class="btn-sm" style="margin:1rem 0;"><i class="fas fa-plus"></i> Add Bank / UPI</button>

        <h3>Request Withdrawal</h3>
        <form id="wdForm">
            <select id="wdMethodSelect" required>
                <option value="">Select payment method</option>
                ${methods?.map(m => {
                    let display = m.type.toUpperCase();
                    if(m.type === 'UPI') display += ` - ${m.details}`;
                    else if(m.type === 'bank') {
                        try {
                            const bankData = JSON.parse(m.details);
                            display += ` - ${bankData.name} (${bankData.account})`;
                        } catch(e) { display += ` - ${m.details}`; }
                    } else display += ` - ${m.details}`;
                    return `<option value="${m.id}">${display}</option>`;
                }).join('')}
            </select>
            <input type="number" id="wdAmount" placeholder="Amount (Min ₹100)" required>
            <button type="submit">Request Withdrawal</button>
        </form>`;
    }

    // Add Bank/UPI modal
    async function addPaymentMethod() {
        const { value: methodType } = await Swal.fire({
            title: 'Add Payment Method',
            text: 'Choose type',
            input: 'select',
            inputOptions: {
                'UPI': 'UPI (UPI ID)',
                'bank': 'Bank Account (Name, Account Number, IFSC)'
            },
            inputPlaceholder: 'Select',
            showCancelButton: true
        });
        if(!methodType) return;

        if(methodType === 'UPI') {
            const { value: upiId } = await Swal.fire({
                title: 'Enter UPI ID',
                input: 'text',
                inputPlaceholder: 'e.g., username@okhdfcbank',
                showCancelButton: true
            });
            if(upiId) {
                const { error } = await supabase.from('payment_methods').insert({
                    uid: currentUser.id,
                    type: 'UPI',
                    details: upiId,
                    is_default: false
                });
                if(error) toast(error.message, "error");
                else { toast("UPI ID saved","success"); renderPanel('withdraw'); }
            }
        } else if(methodType === 'bank') {
            const { value: form } = await Swal.fire({
                title: 'Bank Account Details',
                html: `
                    <input id="bankName" class="swal2-input" placeholder="Full Name (as in account)">
                    <input id="bankAccount" class="swal2-input" placeholder="Account Number">
                    <input id="bankIfsc" class="swal2-input" placeholder="IFSC Code">
                `,
                focusConfirm: false,
                preConfirm: () => {
                    const name = document.getElementById('bankName').value;
                    const account = document.getElementById('bankAccount').value;
                    const ifsc = document.getElementById('bankIfsc').value;
                    if(!name || !account || !ifsc) Swal.showValidationMessage('All fields required');
                    return { name, account, ifsc };
                }
            });
            if(form) {
                const details = JSON.stringify({ name: form.name, account: form.account, ifsc: form.ifsc });
                const { error } = await supabase.from('payment_methods').insert({
                    uid: currentUser.id,
                    type: 'bank',
                    details: details,
                    is_default: false
                });
                if(error) toast(error.message, "error");
                else { toast("Bank account saved","success"); renderPanel('withdraw'); }
            }
        }
    }

    async function deletePaymentMethod(methodId) {
        const confirm = await Swal.fire({ title: 'Delete?', text: 'Remove this payment method?', icon: 'warning', showCancelButton: true });
        if(confirm.isConfirmed){
            const { error } = await supabase.from('payment_methods').delete().eq('id', methodId);
            if(error) toast(error.message, "error");
            else { toast("Deleted","success"); renderPanel('withdraw'); }
        }
    }

    async function requestWithdrawal(amount, methodId) {
        // KYC verification check
        if(userProfile.verification_status !== 'verified'){
            const result = await Swal.fire({
                title: 'KYC Required',
                text: 'You must complete KYC before withdrawing. Would you like to go to KYC page?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Go to KYC',
                cancelButtonText: 'Cancel'
            });
            if(result.isConfirmed){
                setActiveTab('kyc');
            }
            return;
        }

        if(amount < 100) return toast("Minimum withdrawal is ₹100","error");
        if(amount > userProfile.balance) return toast("Insufficient balance","error");
        // Get method details
        const { data: method } = await supabase.from('payment_methods').select('*').eq('id', methodId).single();
        if(!method) return toast("Invalid payment method","error");
        let detailsString = method.details;
        if(method.type === 'bank') {
            try {
                const bankData = JSON.parse(method.details);
                detailsString = `${bankData.name}, A/c: ${bankData.account}, IFSC: ${bankData.ifsc}`;
            } catch(e) {}
        } else if(method.type === 'UPI') {
            detailsString = method.details;
        }
        const { error } = await supabase.from('withdrawals').insert({
            uid: currentUser.id,
            amount: amount,
            method: method.type,
            details: detailsString,
            status: 'pending',
            created_at: new Date()
        });
        if(error) toast(error.message, "error");
        else { toast("Withdrawal request sent!","success"); renderPanel('withdraw'); }
    }

    // ---------- Chat ----------
    async function renderChat(){
        const { data: msgs } = await supabase.from('support_messages').select('*').or(`uid.eq.${currentUser.id},recipient_uid.eq.${currentUser.id}`).order('created_at', { ascending: true });
        return `<h2>💬 Support Chat (Private)</h2>
        <div class="chat-box" id="chatBox">
            ${msgs?.map(m => `<div><strong>${m.is_admin ? 'Admin' : 'You'}:</strong> ${m.message}</div>`).join('') || '<div>No messages yet.</div>'}
        </div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="userChatMsg" placeholder="Type your message...">
            <button id="sendMsgBtn">Send</button>
        </div>`;
    }

    // ---------- Panel Switching ----------
    let currentTab = 'dashboard';
    async function renderPanel(tab){
        currentTab = tab;
        const container = document.getElementById('userMainPanel');
        if(tab === 'dashboard') container.innerHTML = await renderDashboard();
        else if(tab === 'tasks') container.innerHTML = await renderTasks();
        else if(tab === 'referrals') container.innerHTML = await renderReferrals();
        else if(tab === 'kyc') container.innerHTML = await renderKyc();
        else if(tab === 'withdraw') container.innerHTML = await renderWithdraw();
        else if(tab === 'chat') container.innerHTML = await renderChat();
        attachEvents();
    }

    function attachEvents(){
        // Copy buttons
        document.getElementById('copyCodeBtn')?.addEventListener('click',()=>{ navigator.clipboard.writeText(userProfile.referral_code); toast("Code copied!"); });
        document.getElementById('copyLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
        document.getElementById('copyFullLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
        // Task buttons
        document.querySelectorAll('.visitTaskBtn').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.link,'_blank')));
        document.querySelectorAll('.completeTaskBtn').forEach(btn=>btn.addEventListener('click',()=>showSubmissionPopup(btn.dataset.id,btn.dataset.reward)));
        // KYC
        document.getElementById('submitModernKyc')?.addEventListener('click',submitModernKyc);
        // Withdraw
        document.getElementById('addPaymentMethodBtn')?.addEventListener('click', addPaymentMethod);
        document.querySelectorAll('.deleteMethod')?.forEach(btn => btn.addEventListener('click', (e) => deletePaymentMethod(btn.dataset.id)));
        document.getElementById('wdForm')?.addEventListener('submit', async(e) => {
            e.preventDefault();
            const methodId = document.getElementById('wdMethodSelect').value;
            const amount = parseInt(document.getElementById('wdAmount').value);
            if(!methodId) return toast("Select a payment method","error");
            await requestWithdrawal(amount, methodId);
        });
        // Chat
        document.getElementById('sendMsgBtn')?.addEventListener('click',async()=>{
            let msg=document.getElementById('userChatMsg').value;
            if(msg){
                await supabase.from('support_messages').insert({ uid:currentUser.id, message:msg, is_admin:false, created_at:new Date() });
                document.getElementById('userChatMsg').value='';
                renderPanel('chat');
            }
        });
        // Dropdowns and previews
        document.querySelectorAll('.dropdown-header').forEach(header=>{
            header.addEventListener('click',()=>{
                const targetId = header.getAttribute('data-dropdown')+'Content';
                const content = document.getElementById(targetId);
                content.classList.toggle('open');
                const icon = header.querySelector('i.fa-chevron-down, i.fa-chevron-up');
                if(content.classList.contains('open')) icon.classList.replace('fa-chevron-down','fa-chevron-up');
                else icon.classList.replace('fa-chevron-up','fa-chevron-down');
            });
        });
        const preview = (fileId, previewId) => {
            const inp = document.getElementById(fileId);
            if(inp) inp.addEventListener('change',(e)=>{
                if(e.target.files[0]){ const reader = new FileReader(); reader.onload = ev => { document.getElementById(previewId).src = ev.target.result; document.getElementById(previewId).style.display='block'; }; reader.readAsDataURL(e.target.files[0]); }
            });
        };
        preview('aadFrontDoc','previewAadFront'); preview('aadBackDoc','previewAadBack'); preview('aadFrontSelfie','previewAadFrontSelfie'); preview('aadBackSelfie','previewAadBackSelfie');
        preview('panFrontDoc','previewPanFront'); preview('panBackDoc','previewPanBack'); preview('panFrontSelfie','previewPanFrontSelfie'); preview('panBackSelfie','previewPanBackSelfie'); preview('hdProfilePic','previewHd');
    }

    async function showSubmissionPopup(taskId, reward){
        const result = await Swal.fire({ title:'Submit Proof', html:`<textarea id="proofText" placeholder="Proof text or URL"></textarea><input id="proofUrl" placeholder="Screenshot URL">`, preConfirm:()=>({ text:document.getElementById('proofText').value, url:document.getElementById('proofUrl').value }) });
        if(result.value){
            let proof = result.value.url || result.value.text;
            if(!proof) return toast("Provide proof","error");
            await supabase.from('submissions').insert({ uid:currentUser.id, task_id:taskId, proof, status:'pending', reward:parseInt(reward) });
            toast("Submitted for review","success");
            renderPanel('tasks');
        }
    }

    function showAuthModal(){
        Swal.fire({ title:'GameLoot', html:`<input id="authEmail" placeholder="Email"><input id="authPass" type="password" placeholder="Password"><select id="authMode"><option value="login">Login</option><option value="signup">Sign Up</option></select>`, preConfirm:()=>({ email:document.getElementById('authEmail').value, pass:document.getElementById('authPass').value, mode:document.getElementById('authMode').value }) }).then(async(r)=>{
            if(r.value.mode==='signup'){ const{error}=await supabase.auth.signUp({ email:r.value.email, password:r.value.pass }); if(error) toast(error.message,"error"); else toast("Check email to verify","info"); }
            else{ const{error}=await supabase.auth.signInWithPassword({ email:r.value.email, password:r.value.pass }); if(error) toast(error.message,"error"); else location.reload(); }
        });
    }

    function setActiveTab(tabId){
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll(`.nav-item[data-tab="${tabId}"], .bottom-nav-item[data-tab="${tabId}"]`).forEach(el => el.classList.add('active'));
        renderPanel(tabId);
    }

    document.querySelectorAll('.nav-item[data-tab], .bottom-nav-item[data-tab]').forEach(el => {
        el.addEventListener('click', (e) => { const tab = el.getAttribute('data-tab'); if(tab) setActiveTab(tab); });
    });
    document.getElementById('userLogoutBtn').addEventListener('click',async()=>{ await supabase.auth.signOut(); location.reload(); });
    checkAuth();
})();
</script>
</body>
</html>
