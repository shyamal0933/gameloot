<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GameLoot | Earn Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0b0e17;color:#eef5ff;}
        .app-wrapper{display:flex;min-height:100vh;}
        .sidebar{width:280px;background:rgba(15,20,35,0.9);backdrop-filter:blur(16px);border-right:1px solid rgba(0,242,254,0.25);padding:2rem 1rem;position:fixed;height:100vh;}
        .logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2rem;text-align:center;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:6px 0;border-radius:40px;cursor:pointer;color:#a0abcf;}
        .nav-item i{width:26px;}
        .nav-item.active,.nav-item:hover{background:rgba(0,242,254,0.12);color:#00f2fe;}
        .main-panel{flex:1;margin-left:280px;padding:2rem;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2rem;margin-bottom:2rem;}
        .stat-card{background:rgba(20,28,45,0.65);backdrop-filter:blur(8px);border-radius:28px;padding:1.2rem;border:1px solid rgba(0,255,255,0.2);}
        .stat-card h4{font-size:0.8rem;color:#8e9acf;}
        .stat-card .value{font-size:2rem;font-weight:700;margin-top:8px;}
        .tasks-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;margin-top:1rem;}
        .task-card{background:#111827;border-radius:28px;padding:1.2rem;border:1px solid #2a3448;}
        .reward-badge{background:#00f2fe20;color:#00f2fe;padding:4px 12px;border-radius:40px;display:inline-block;margin:8px 0;}
        button{background:linear-gradient(95deg,#0055ff,#00c3ff);border:none;padding:8px 18px;border-radius:40px;color:white;font-weight:600;cursor:pointer;transition:0.2s;}
        button:hover{transform:scale(1.02);}
        .referral-box{background:#0a0f1c;border-radius:20px;padding:1rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
        @media (max-width:760px){.sidebar{width:80px;}.sidebar span{display:none;}.main-panel{margin-left:80px;}}
        .kyc-card{background:rgba(12,18,28,0.8);border-radius:32px;padding:1.5rem;margin-bottom:2rem;border:1px solid #2a3a5a;}
        .kyc-card h3{font-size:1.4rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px;}
        .dropdown-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:12px;background:#0a0f1a;border-radius:60px;margin-bottom:1rem;}
        .dropdown-content{display:none;padding:1rem 0;animation:fadeIn 0.3s;}
        .dropdown-content.open{display:block;}
        .file-group{margin-bottom:1.2rem;background:#131c2c;padding:12px;border-radius:24px;}
        .file-group label{font-weight:500;display:block;margin-bottom:6px;}
        input,textarea,select{background:#1e293b;border:1px solid #334155;border-radius:28px;padding:12px;width:100%;color:white;}
        .image-preview{width:80px;height:80px;object-fit:cover;border-radius:16px;margin-top:8px;border:1px solid cyan;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar">
        <div class="logo">🎮 GAMELOOT</div>
        <div class="nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div>
        <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Earn Tasks</span></div>
        <div class="nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Referrals</span></div>
        <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
        <div class="nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
        <div class="nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Support</span></div>
        <div class="nav-item" id="userLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>
    <div class="main-panel" id="userMainPanel"></div>
</div>
<script>
(function(){
    const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, userProfile = null;

    function toast(msg, icon='info'){ Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:3000}); }

    async function ensureProfile(userId, email){
        // First try to fetch existing profile
        let { data: profile, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (error && error.code === 'PGRST116') { // not found
            console.log("Profile not found, creating new profile...");
            const newProfile = {
                id: userId,
                email: email,
                name: email.split('@')[0],
                balance: 0,
                verification_status: 'pending',
                referral_code: 'GL' + Math.random().toString(36).substring(2,8).toUpperCase(),
                total_referrals: 0,
                referral_earnings: 0,
                fraud_score: 0,
                account_status: 'active',
                is_admin: false,
                created_at: new Date()
            };
            const { data: inserted, error: insertError } = await supabase.from('profiles').insert(newProfile).select().single();
            if (insertError) {
                console.error("Profile insert error:", insertError);
                throw insertError;
            }
            profile = inserted;
            toast("Account profile created successfully!", "success");
        } else if (error) {
            console.error("Profile fetch error:", error);
            throw error;
        }
        return profile;
    }

    async function checkAuth(){
        const { data: { user } } = await supabase.auth.getUser();
        if(!user){ showAuthModal(); return; }
        currentUser = user;
        if(!user.email_confirmed_at){
            await supabase.auth.signOut();
            Swal.fire("Email Not Verified","Please verify your email.","error");
            showAuthModal(); return;
        }
        // Ensure profile exists before anything else
        try {
            userProfile = await ensureProfile(user.id, user.email);
        } catch(err) {
            console.error("Failed to ensure profile:", err);
            toast("Profile setup failed. Please log out and log in again.", "error");
            return;
        }
        // Handle referral from URL
        const ref = new URLSearchParams(window.location.search).get('ref');
        if(ref && !userProfile.referred_by){
            await supabase.from('profiles').update({ referred_by: ref }).eq('id', user.id);
            toast("Referral code applied!","success");
        }
        renderPanel('dashboard');
    }

    async function renderDashboard(){
        const { data: submissions } = await supabase.from('submissions').select('status').eq('uid', currentUser.id);
        const total = submissions?.length || 0;
        const completed = submissions?.filter(s => s.status === 'approved').length || 0;
        return `<h2>Welcome, ${userProfile.name} 🎯</h2>
        <div class="stats-grid">
            <div class="stat-card"><h4>💰 Balance</h4><div class="value">₹${userProfile.balance||0}</div></div>
            <div class="stat-card"><h4>✅ KYC</h4><div class="value">${userProfile.verification_status?.toUpperCase()}</div></div>
            <div class="stat-card"><h4>📋 Total Tasks</h4><div class="value">${total}</div></div>
            <div class="stat-card"><h4>✔️ Completed</h4><div class="value">${completed}</div></div>
            <div class="stat-card"><h4>👥 Referrals</h4><div class="value">${userProfile.total_referrals||0}</div></div>
            <div class="stat-card"><h4>🏆 Referral Earn</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div>
        </div>
        <div class="referral-box"><span><i class="fas fa-link"></i> Your Code: <strong>${userProfile.referral_code}</strong></span>
        <button id="copyCodeBtn">Copy Code</button><button id="copyLinkBtn">Copy Referral Link</button></div>`;
    }

    async function renderTasks(){
        const { data: tasks } = await supabase.from('tasks').select('*');
        return `<h2>Available Tasks</h2><div class="tasks-container">${tasks?.map(t=>`
            <div class="task-card"><h3>${t.title}</h3><p>${t.description}</p><div class="reward-badge">+₹${t.reward}</div><p>${t.category}</p>
            <button class="visitTaskBtn" data-link="${t.link}">Visit</button> <button class="completeTaskBtn" data-id="${t.id}" data-reward="${t.reward}">Complete</button></div>
        `).join('')||'<p>No tasks yet. Admin will add soon.</p>'}</div>`;
    }

    async function renderReferrals(){
        const link = `${location.origin}${location.pathname}?ref=${userProfile.referral_code}`;
        return `<h2>Referrals</h2><div class="referral-box" style="flex-direction:column;"><div>🔗 ${link}</div><button id="copyFullLinkBtn">Copy Link</button></div>
        <div class="stats-grid"><div class="stat-card"><h4>Total Referrals</h4><div class="value">${userProfile.total_referrals||0}</div></div>
        <div class="stat-card"><h4>Earnings</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div></div>
        <p class="status-badge">⚠️ Bonus after email+KYC+3 tasks+24h</p>`;
    }

    async function renderKyc(){
        const { data: existing } = await supabase.from('verifications').select('*').eq('uid', currentUser.id).single();
        if(existing?.status === 'verified') return `<h2>KYC Status</h2><div class="stat-card">✅ Verified! You can withdraw.</div>`;
        if(existing?.status === 'pending') return `<h2>KYC Status</h2><div class="stat-card">⏳ Under review.</div>`;
        return `
        <h2 style="margin-bottom:1rem;"><i class="fas fa-id-card"></i> Complete KYC (Mandatory)</h2>
        <form id="kycModernForm">
            <div class="kyc-card">
                <div class="dropdown-header" data-dropdown="aadhaar">
                    <h3><i class="fas fa-id-card"></i> Aadhaar Verification</h3>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div id="aadhaarContent" class="dropdown-content">
                    <input type="text" id="aadhaarNum" placeholder="Aadhaar Number (12 digits)" required>
                    <div class="file-group"><label>Aadhaar Front (Document)</label><input type="file" id="aadFrontDoc" accept="image/*"><img id="previewAadFront" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Back (Document)</label><input type="file" id="aadBackDoc" accept="image/*"><img id="previewAadBack" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Front Selfie (holding phone)</label><input type="file" id="aadFrontSelfie" accept="image/*"><img id="previewAadFrontSelfie" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>Aadhaar Back Selfie (holding phone)</label><input type="file" id="aadBackSelfie" accept="image/*"><img id="previewAadBackSelfie" class="image-preview" style="display:none;"></div>
                </div>
            </div>
            <div class="kyc-card">
                <div class="dropdown-header" data-dropdown="pan">
                    <h3><i class="fas fa-credit-card"></i> PAN Card Verification</h3>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div id="panContent" class="dropdown-content">
                    <input type="text" id="panNum" placeholder="PAN Number (e.g., ABCDE1234F)" required>
                    <div class="file-group"><label>PAN Front Document</label><input type="file" id="panFrontDoc" accept="image/*"><img id="previewPanFront" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Back Document (if any)</label><input type="file" id="panBackDoc" accept="image/*"><img id="previewPanBack" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Front Selfie (holding PAN card)</label><input type="file" id="panFrontSelfie" accept="image/*"><img id="previewPanFrontSelfie" class="image-preview" style="display:none;"></div>
                    <div class="file-group"><label>PAN Back Selfie</label><input type="file" id="panBackSelfie" accept="image/*"><img id="previewPanBackSelfie" class="image-preview" style="display:none;"></div>
                </div>
            </div>
            <div class="kyc-card">
                <h3><i class="fas fa-camera"></i> HD Profile Picture</h3>
                <div class="file-group"><label>High Resolution Photo (clear face)</label><input type="file" id="hdProfilePic" accept="image/*"><img id="previewHd" class="image-preview" style="display:none;"></div>
            </div>
            <button type="button" id="submitModernKyc">Submit All Documents</button>
        </form>`;
    }

    async function uploadFile(file, fullPath){
        if(!file) return null;
        const { data, error } = await supabase.storage.from('kyc_docs').upload(fullPath, file, { upsert: true });
        if(error) throw error;
        return fullPath;
    }

    async function submitModernKyc(){
        // FIRST: ensure profile exists to avoid foreign key violation
        if (!userProfile) {
            toast("Refreshing profile...", "info");
            try {
                userProfile = await ensureProfile(currentUser.id, currentUser.email);
            } catch(e) {
                toast("Profile setup failed. Please log out and log in again.", "error");
                return;
            }
        }
        
        const aadhaarNum = document.getElementById('aadhaarNum').value;
        const panNum = document.getElementById('panNum').value;
        if(!aadhaarNum || !panNum) return toast("Aadhaar and PAN numbers required","error");
        
        const aadFrontDoc = document.getElementById('aadFrontDoc').files[0];
        const aadBackDoc = document.getElementById('aadBackDoc').files[0];
        const aadFrontSelfie = document.getElementById('aadFrontSelfie').files[0];
        const aadBackSelfie = document.getElementById('aadBackSelfie').files[0];
        const panFrontDoc = document.getElementById('panFrontDoc').files[0];
        const panBackDoc = document.getElementById('panBackDoc').files[0];
        const panFrontSelfie = document.getElementById('panFrontSelfie').files[0];
        const panBackSelfie = document.getElementById('panBackSelfie').files[0];
        const hdPic = document.getElementById('hdProfilePic').files[0];
        
        if(!aadFrontDoc||!aadBackDoc||!aadFrontSelfie||!aadBackSelfie) return toast("All Aadhaar images required","error");
        if(!panFrontDoc||!panFrontSelfie) return toast("PAN front document and selfie required","error");
        if(!hdPic) return toast("HD profile picture required","error");
        
        toast("Uploading documents...","info");
        
        try {
            const folder = `${currentUser.id}/kyc`;
            const profileFolder = `${currentUser.id}/profile`;
            
            const aadFrontUrl = await uploadFile(aadFrontDoc, `${folder}/aad_front_doc`);
            const aadBackUrl = await uploadFile(aadBackDoc, `${folder}/aad_back_doc`);
            const aadFrontSelfieUrl = await uploadFile(aadFrontSelfie, `${folder}/aad_front_selfie`);
            const aadBackSelfieUrl = await uploadFile(aadBackSelfie, `${folder}/aad_back_selfie`);
            const panFrontUrl = await uploadFile(panFrontDoc, `${folder}/pan_front_doc`);
            const panBackUrl = panBackDoc ? await uploadFile(panBackDoc, `${folder}/pan_back_doc`) : null;
            const panFrontSelfieUrl = await uploadFile(panFrontSelfie, `${folder}/pan_front_selfie`);
            const panBackSelfieUrl = panBackSelfie ? await uploadFile(panBackSelfie, `${folder}/pan_back_selfie`) : null;
            const hdUrl = await uploadFile(hdPic, `${profileFolder}/hd.jpg`);
            
            const { error: insertError } = await supabase.from('verifications').insert({
                uid: currentUser.id,
                full_name: userProfile.name,
                aadhaar_number: aadhaarNum,
                aadhaar_front: aadFrontUrl,
                aadhaar_back: aadBackUrl,
                aadhaar_front_selfie: aadFrontSelfieUrl,
                aadhaar_back_selfie: aadBackSelfieUrl,
                pan_number: panNum,
                pan_front_doc: panFrontUrl,
                pan_back_doc: panBackUrl,
                pan_front_selfie: panFrontSelfieUrl,
                pan_back_selfie: panBackSelfieUrl,
                user_hd_pic: hdUrl,
                status: 'pending',
                submitted_at: new Date()
            });
            if(insertError) throw insertError;
            
            toast("KYC submitted successfully! Pending review.","success");
            renderPanel('kyc');
        } catch(err) {
            console.error("KYC submission error:", err);
            toast("Upload failed: " + err.message, "error");
        }
    }

    async function renderWithdraw(){
        if(userProfile.verification_status !== 'verified') return `<h2>Withdraw</h2><div class="stat-card">⚠️ Complete KYC first.</div>`;
        return `<h2>Withdraw Funds</h2><form id="wdForm"><input type="number" id="wdAmount" placeholder="Amount (Min ₹100)"><select id="wdMethod"><option>UPI</option><option>Bank Transfer</option><option>Crypto</option></select><input id="wdDetails" placeholder="Payment details"><button type="submit">Request</button></form>`;
    }

    async function renderChat(){
        const { data: msgs } = await supabase.from('support_messages').select('*').or(`uid.eq.${currentUser.id},is_admin.eq.true`).order('created_at');
        return `<h2>Support Chat</h2><div id="chatBox" style="height:250px; overflow-y:auto; background:#0f1222; border-radius:20px; padding:1rem;">${msgs?.map(m=>`<div><strong>${m.is_admin?'Admin':'You'}:</strong> ${m.message}</div>`).join('')}</div><div style="display:flex; gap:10px; margin-top:10px;"><input type="text" id="userChatMsg"><button id="sendMsgBtn">Send</button></div>`;
    }

    let currentTab = 'dashboard';
    async function renderPanel(tab){
        currentTab = tab;
        const container = document.getElementById('userMainPanel');
        if(tab === 'dashboard') container.innerHTML = await renderDashboard();
        else if(tab === 'tasks') container.innerHTML = await renderTasks();
        else if(tab === 'referrals') container.innerHTML = await renderReferrals();
        else if(tab === 'kyc') container.innerHTML = await renderKyc();
        else if(tab === 'withdraw') container.innerHTML = await renderWithdraw();
        else if(tab === 'chat') container.innerHTML = await renderChat();
        attachEvents();
    }

    function attachEvents(){
        document.getElementById('copyCodeBtn')?.addEventListener('click',()=>{ navigator.clipboard.writeText(userProfile.referral_code); toast("Code copied!"); });
        document.getElementById('copyLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
        document.getElementById('copyFullLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
        document.querySelectorAll('.visitTaskBtn').forEach(btn=>btn.addEventListener('click',()=>window.open(btn.dataset.link,'_blank')));
        document.querySelectorAll('.completeTaskBtn').forEach(btn=>btn.addEventListener('click',()=>showSubmissionPopup(btn.dataset.id,btn.dataset.reward)));
        document.getElementById('submitModernKyc')?.addEventListener('click',submitModernKyc);
        document.getElementById('wdForm')?.addEventListener('submit',async(e)=>{ e.preventDefault(); let amt=document.getElementById('wdAmount').value; if(amt<100) return toast("Min ₹100","error"); await supabase.from('withdrawals').insert({ uid:currentUser.id, amount:amt, method:document.getElementById('wdMethod').value, details:document.getElementById('wdDetails').value, status:'pending' }); toast("Request sent","success"); renderPanel('withdraw'); });
        document.getElementById('sendMsgBtn')?.addEventListener('click',async()=>{ let msg=document.getElementById('userChatMsg').value; if(msg){ await supabase.from('support_messages').insert({ uid:currentUser.id, message:msg, is_admin:false }); document.getElementById('userChatMsg').value=''; renderPanel('chat'); } });
        
        document.querySelectorAll('.dropdown-header').forEach(header=>{
            header.addEventListener('click',()=>{
                const targetId = header.getAttribute('data-dropdown')+'Content';
                const content = document.getElementById(targetId);
                content.classList.toggle('open');
                const icon = header.querySelector('i.fa-chevron-down, i.fa-chevron-up');
                if(content.classList.contains('open')) icon.classList.replace('fa-chevron-down','fa-chevron-up');
                else icon.classList.replace('fa-chevron-up','fa-chevron-down');
            });
        });
        
        const setupPreview = (fileId, previewId) => {
            const inp = document.getElementById(fileId);
            if(inp) inp.addEventListener('change',(e)=>{
                if(e.target.files[0]){ const reader = new FileReader(); reader.onload = ev => { document.getElementById(previewId).src = ev.target.result; document.getElementById(previewId).style.display='block'; }; reader.readAsDataURL(e.target.files[0]); }
            });
        };
        setupPreview('aadFrontDoc','previewAadFront');
        setupPreview('aadBackDoc','previewAadBack');
        setupPreview('aadFrontSelfie','previewAadFrontSelfie');
        setupPreview('aadBackSelfie','previewAadBackSelfie');
        setupPreview('panFrontDoc','previewPanFront');
        setupPreview('panBackDoc','previewPanBack');
        setupPreview('panFrontSelfie','previewPanFrontSelfie');
        setupPreview('panBackSelfie','previewPanBackSelfie');
        setupPreview('hdProfilePic','previewHd');
    }

    async function showSubmissionPopup(taskId, reward){
        const result = await Swal.fire({ title:'Submit Proof', html:`<textarea id="proofText" placeholder="Proof text or URL"></textarea><input id="proofUrl" placeholder="Screenshot URL">`, preConfirm:()=>({ text:document.getElementById('proofText').value, url:document.getElementById('proofUrl').value }) });
        if(result.value){
            let proof = result.value.url || result.value.text;
            if(!proof) return toast("Provide proof","error");
            await supabase.from('submissions').insert({ uid:currentUser.id, task_id:taskId, proof, status:'pending', reward:parseInt(reward) });
            toast("Submitted for review","success");
            renderPanel('tasks');
        }
    }

    function showAuthModal(){
        Swal.fire({ title:'GameLoot', html:`<input id="authEmail" placeholder="Email"><input id="authPass" type="password" placeholder="Password"><select id="authMode"><option value="login">Login</option><option value="signup">Sign Up</option></select>`, preConfirm:()=>({ email:document.getElementById('authEmail').value, pass:document.getElementById('authPass').value, mode:document.getElementById('authMode').value }) }).then(async(r)=>{
            if(r.value.mode==='signup'){ const{error}=await supabase.auth.signUp({ email:r.value.email, password:r.value.pass }); if(error) toast(error.message,"error"); else toast("Check email to verify","info"); }
            else{ const{error}=await supabase.auth.signInWithPassword({ email:r.value.email, password:r.value.pass }); if(error) toast(error.message,"error"); else location.reload(); }
        });
    }

    document.getElementById('userLogoutBtn').addEventListener('click',async()=>{ await supabase.auth.signOut(); location.reload(); });
    document.querySelectorAll('.nav-item[data-tab]').forEach(el=>el.addEventListener('click',()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); renderPanel(el.dataset.tab); }));
    checkAuth();
})();
</script>
</body>
</html>
