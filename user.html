<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GameLoot | Work Small, Earn Big</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0b0e17; color:#eef5ff; overflow-x:hidden; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(10,14,23,0.8); backdrop-filter:blur(10px); border-bottom:1px solid rgba(0,242,254,0.2); position:sticky; top:0; z-index:100; }
        .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#00f2fe,#4facfe); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .auth-buttons { display:flex; gap:12px; }
        .btn-outline { background:transparent; border:1px solid #00f2fe; padding:8px 20px; border-radius:40px; color:#00f2fe; font-weight:600; cursor:pointer; transition:0.2s; }
        .btn-primary { background:linear-gradient(95deg,#0055ff,#00c3ff); border:none; padding:8px 20px; border-radius:40px; color:white; font-weight:600; cursor:pointer; }
        .hero { min-height:calc(100vh - 80px); display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2rem; }
        .hero h1 { font-size:3rem; font-weight:800; background:linear-gradient(135deg,#fff,#00f2fe); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
        .hero p { font-size:1.2rem; color:#a0abcf; max-width:600px; margin-bottom:2rem; }
        .feature-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:2rem; margin-top:4rem; width:100%; max-width:1000px; }
        .feature-card { background:rgba(20,28,45,0.7); backdrop-filter:blur(8px); border-radius:28px; padding:1.5rem; border:1px solid rgba(0,255,255,0.2); }
        .feature-card i { font-size:2rem; color:#00f2fe; margin-bottom:1rem; }
        .dashboard-container { display:flex; min-height:100vh; }
        .sidebar { width:280px; background:rgba(15,20,35,0.95); backdrop-filter:blur(16px); border-right:1px solid rgba(0,242,254,0.25); padding:2rem 1rem; position:fixed; height:100vh; overflow-y:auto; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:12px 20px; margin:6px 0; border-radius:40px; cursor:pointer; color:#a0abcf; transition:0.2s; }
        .nav-item i { width:26px; }
        .nav-item.active,.nav-item:hover { background:rgba(0,242,254,0.12); color:#00f2fe; }
        .main-panel { flex:1; margin-left:280px; padding:2rem; transition:margin 0.3s; }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(10,14,23,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(0,242,254,0.3); padding:10px 16px; justify-content:space-around; z-index:200; }
        .bottom-nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; color:#8e9acf; font-size:0.7rem; cursor:pointer; }
        .bottom-nav-item i { font-size:1.4rem; }
        .bottom-nav-item.active { color:#00f2fe; }
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); }
            .main-panel { margin-left:0; padding:1rem 1rem 80px 1rem; }
            .bottom-nav { display:flex; }
            .hero h1 { font-size:2rem; }
            .hero p { font-size:1rem; }
            .auth-buttons button { padding:6px 14px; font-size:0.9rem; }
        }
        /* Dashboard components - same as before */
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:2rem; }
        .stat-card { background:rgba(20,28,45,0.7); backdrop-filter:blur(8px); border-radius:28px; padding:1.2rem; border:1px solid rgba(0,255,255,0.2); }
        .stat-card h4 { font-size:0.8rem; color:#8e9acf; }
        .stat-card .value { font-size:1.8rem; font-weight:700; }
        .tasks-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.2rem; margin-top:1rem; }
        .task-card { background:#111827; border-radius:28px; padding:1.2rem; border:1px solid #2a3448; }
        .reward-badge { background:rgba(0,242,254,0.15); color:#00f2fe; padding:4px 12px; border-radius:40px; display:inline-block; margin:8px 0; }
        button { background:linear-gradient(95deg,#0055ff,#00c3ff); border:none; padding:10px 20px; border-radius:40px; color:white; font-weight:600; cursor:pointer; }
        .btn-sm { padding:6px 12px; font-size:0.8rem; background:#1e2a47; }
        .referral-box { background:#0a0f1c; border-radius:20px; padding:1rem; margin-top:1rem; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .kyc-card, .payment-method-card { background:rgba(12,18,28,0.8); border-radius:32px; padding:1rem; margin-bottom:1rem; border:1px solid #2a3a5a; }
        .dropdown-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px; background:#0a0f1a; border-radius:60px; margin-bottom:1rem; }
        .dropdown-content { display:none; padding:0.5rem 0; }
        .dropdown-content.open { display:block; }
        .file-group { margin-bottom:1rem; background:#131c2c; padding:10px; border-radius:20px; }
        input, textarea, select { background:#1e293b; border:1px solid #334155; border-radius:28px; padding:12px; width:100%; color:white; }
        .image-preview { width:70px; height:70px; object-fit:cover; border-radius:12px; margin-top:8px; border:1px solid cyan; display:none; }
        .chat-box { height:280px; overflow-y:auto; background:#0f1222; border-radius:24px; padding:1rem; margin-bottom:1rem; }
        .help-content { background:#0f1222; border-radius:16px; padding:1rem; margin:1rem 0; }
        .countdown { font-size:0.8rem; background:#00000050; padding:4px 8px; border-radius:20px; display:inline-block; margin-top:8px; }
        /* Enhanced modal custom styles (SweetAlert2 override) */
        .custom-auth-modal {
            background: rgba(15, 25, 45, 0.95) !important;
            backdrop-filter: blur(16px);
            border-radius: 32px !important;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .custom-auth-modal .swal2-title {
            color: #00f2fe;
            font-size: 1.8rem;
        }
        .custom-auth-modal .swal2-html-container {
            padding: 0 1rem 1rem;
        }
        .custom-auth-modal input, 
        .custom-auth-modal select {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 60px;
            padding: 14px 20px;
            margin: 12px 0;
            width: 100%;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .custom-auth-modal input:focus {
            border-color: #00f2fe;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0,242,254,0.2);
        }
        .custom-auth-modal .swal2-confirm {
            background: linear-gradient(95deg, #0055ff, #00c3ff);
            border-radius: 60px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }
        .custom-auth-modal .swal2-cancel {
            background: transparent;
            border: 1px solid #00f2fe;
            color: #00f2fe;
            border-radius: 60px;
            padding: 12px 24px;
        }
        @media (max-width: 500px) {
            .custom-auth-modal {
                width: 90% !important;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    (async function(){
        const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let userProfile = null;

        function toast(msg, icon='info'){ Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:3000}); }

        // ---------- Enhanced Auth Modals ----------
        async function showSignUpModal() {
            const { value: form } = await Swal.fire({
                title: 'Create Account',
                html: `
                    <div style="text-align:left">
                        <input id="signupName" placeholder="Full Name" autocomplete="name">
                        <input id="signupEmail" placeholder="Email" type="email" autocomplete="email">
                        <input id="signupPassword" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password">
                        <input id="signupRef" placeholder="Referral Code (optional)" autocomplete="off">
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Sign Up',
                cancelButtonText: 'Cancel',
                customClass: { popup: 'custom-auth-modal' },
                preConfirm: () => {
                    const name = document.getElementById('signupName').value.trim();
                    const email = document.getElementById('signupEmail').value.trim();
                    const password = document.getElementById('signupPassword').value;
                    const ref = document.getElementById('signupRef').value.trim();
                    if (!name) Swal.showValidationMessage('Full name is required');
                    else if (!email) Swal.showValidationMessage('Email is required');
                    else if (!password) Swal.showValidationMessage('Password is required');
                    else if (password.length < 6) Swal.showValidationMessage('Password must be at least 6 characters');
                    else return { name, email, password, ref };
                }
            });
            if (form) {
                const { error } = await supabase.auth.signUp({
                    email: form.email,
                    password: form.password,
                    options: { data: { name: form.name, referral: form.ref } }
                });
                if (error) toast(error.message, "error");
                else {
                    toast("Verification email sent! Check your inbox and spam.", "success");
                    showSignInModal();
                }
            }
        }

        async function showSignInModal() {
            const { value: form } = await Swal.fire({
                title: 'Welcome Back',
                html: `
                    <div style="text-align:left">
                        <input id="loginEmail" placeholder="Email" type="email" autocomplete="email">
                        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Sign In',
                cancelButtonText: 'Cancel',
                customClass: { popup: 'custom-auth-modal' },
                preConfirm: () => {
                    const email = document.getElementById('loginEmail').value.trim();
                    const password = document.getElementById('loginPassword').value;
                    if (!email) Swal.showValidationMessage('Email is required');
                    else if (!password) Swal.showValidationMessage('Password is required');
                    else return { email, password };
                }
            });
            if (form) {
                const { error } = await supabase.auth.signInWithPassword({ email: form.email, password: form.password });
                if (error) toast(error.message, "error");
                else location.reload();
            }
        }

        // ---------- Ensure Profile (same as before) ----------
        async function ensureProfile(userId, email, metadataName) {
            let { data: profile, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (error && error.code === 'PGRST116') {
                const name = metadataName || email.split('@')[0];
                const newProfile = {
                    id: userId,
                    email: email,
                    name: name,
                    balance: 0,
                    verification_status: 'pending',
                    referral_code: 'GL' + Math.random().toString(36).substring(2,8).toUpperCase(),
                    total_referrals: 0,
                    referral_earnings: 0,
                    fraud_score: 0,
                    account_status: 'active',
                    is_admin: false,
                    created_at: new Date(),
                    referral_count: 0,
                    referral_kyc_bonus_paid: false,
                    kyc_bonus_received: false
                };
                const { error: insertError } = await supabase.from('profiles').insert(newProfile);
                if (insertError) throw insertError;
                profile = newProfile;
            } else if (error) throw error;
            return profile;
        }

        // ---------- Dashboard Functions (unchanged, but keep full implementation) ----------
        async function renderDashboard() {
            const { data: submissions } = await supabase.from('submissions').select('status').eq('uid', currentUser.id);
            const total = submissions?.length || 0;
            const completed = submissions?.filter(s => s.status === 'approved').length || 0;
            return `
            <h2>Welcome, ${userProfile.name || 'Explorer'} 🎯</h2>
            <div class="stats-grid">
                <div class="stat-card"><h4>💰 Balance</h4><div class="value">₹${userProfile.balance||0}</div></div>
                <div class="stat-card"><h4>✅ KYC</h4><div class="value">${userProfile.verification_status?.toUpperCase()}</div></div>
                <div class="stat-card"><h4>📋 Tasks</h4><div class="value">${total}</div></div>
                <div class="stat-card"><h4>✔️ Done</h4><div class="value">${completed}</div></div>
                <div class="stat-card"><h4>👥 Referrals</h4><div class="value">${userProfile.referral_count||0}</div></div>
                <div class="stat-card"><h4>🏆 Referral Earnings</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div>
            </div>
            <div class="referral-box"><span><i class="fas fa-link"></i> Your Code: <strong>${userProfile.referral_code}</strong></span>
            <button id="copyCodeBtn" class="btn-sm">Copy Code</button><button id="copyLinkBtn" class="btn-sm">Copy Link</button></div>`;
        }

        async function renderTasks() {
            const { data: tasks } = await supabase.from('tasks').select('*');
            if (!tasks || tasks.length === 0) return `<h2>Available Tasks</h2><p>No tasks yet. Admin will add soon.</p>`;
            return `<h2>🔥 Available Tasks</h2>
            <div class="tasks-container">${tasks.map(t => `
                <div class="task-card">
                    <h3>${t.title}</h3>
                    <p>${t.description}</p>
                    <div class="reward-badge">+₹${t.reward}</div>
                    <div><a href="${t.link}" target="_blank" class="btn-sm">Visit Link</a></div>
                    ${t.deadline ? `<div class="countdown" data-deadline="${t.deadline}" data-id="${t.id}">Loading...</div>` : ''}
                    <div class="help-content" style="display:none;" id="help-${t.id}">${t.help_text || ''}</div>
                    <button class="toggleHelpBtn" data-id="${t.id}">Show Help</button>
                    <button class="startTaskBtn" data-task='${JSON.stringify(t)}'>Start Task</button>
                </div>
            `).join('')}</div>`;
        }

        async function startTask(task) {
            const { data: existing } = await supabase.from('submissions').select('id, status, rejection_reason').eq('uid', currentUser.id).eq('task_id', task.id).maybeSingle();
            if(existing?.status === 'pending') return toast("Already pending.", "warning");
            if(existing?.status === 'approved') return toast("Already completed!", "success");
            let fieldsHtml = '';
            for(const f of (task.custom_fields || [])) {
                fieldsHtml += `<div><label>${f.label} ${f.required?'*':''}</label>${f.type==='file'?`<input type="file" id="field_${f.label.replace(/\s/g,'_')}" ${f.required?'required':''}>`:`<input type="${f.type}" id="field_${f.label.replace(/\s/g,'_')}" ${f.required?'required':''}>`}</div>`;
            }
            const { value: formData } = await Swal.fire({
                title: task.title,
                html: `<div><p>${task.description}</p><p>Reward: ₹${task.reward}</p><a href="${task.link}" target="_blank">Open Link</a><div class="help-content">${task.help_text||''}</div><hr>${fieldsHtml}</div>`,
                width: '700px',
                preConfirm: async () => {
                    let submissionData = {};
                    for(const f of (task.custom_fields || [])) {
                        const input = document.getElementById(`field_${f.label.replace(/\s/g,'_')}`);
                        if(f.type === 'file') {
                            const file = input.files[0];
                            if(f.required && !file) { Swal.showValidationMessage(`${f.label} required`); return false; }
                            if(file) {
                                const path = `task_submissions/${currentUser.id}/${task.id}/${Date.now()}_${file.name}`;
                                const { error } = await supabase.storage.from('kyc_docs').upload(path, file);
                                if(error) { Swal.showValidationMessage(error.message); return false; }
                                submissionData[f.label] = path;
                            }
                        } else {
                            const val = input.value;
                            if(f.required && !val) { Swal.showValidationMessage(`${f.label} required`); return false; }
                            submissionData[f.label] = val;
                        }
                    }
                    return { submissionData };
                }
            });
            if(formData) {
                if(existing?.id) await supabase.from('submissions').update({ submission_data: formData.submissionData, status: 'pending', rejection_reason: null }).eq('id', existing.id);
                else await supabase.from('submissions').insert({ uid: currentUser.id, task_id: task.id, submission_data: formData.submissionData, status: 'pending', reward: task.reward });
                toast("Task submitted for review!", "success");
                renderPanel('tasks');
            }
        }

        async function renderReferrals() {
            const link = `${location.origin}${location.pathname}?ref=${userProfile.referral_code}`;
            const { data: referredUsers } = await supabase.from('profiles').select('id, email, name, verification_status, kyc_bonus_received').eq('referred_by', userProfile.referral_code);
            const { data: commissions } = await supabase.from('referral_commissions').select('commission_amount').eq('referrer_uid', currentUser.id);
            const totalCommission = commissions?.reduce((s,c)=>s+c.commission_amount,0) || 0;
            const successfulReferrals = referredUsers?.filter(u => u.kyc_bonus_received === true).length || 0;
            const pendingReferrals = referredUsers?.filter(u => u.kyc_bonus_received !== true).length || 0;
            let referredListHtml = '';
            for(const ref of referredUsers || []) {
                const { data: refComm } = await supabase.from('referral_commissions').select('commission_amount').eq('referrer_uid', currentUser.id).eq('referred_uid', ref.id);
                const totalFromRef = refComm?.reduce((s,c)=>s+c.commission_amount,0) || 0;
                referredListHtml += `<div class="payment-method-card"><div><strong>${ref.name || ref.email}</strong><br>KYC: ${ref.verification_status}<br>Bonus paid: ${ref.kyc_bonus_received ? '✅' : '⏳'}</div><div>Commission: ₹${totalFromRef}</div></div>`;
            }
            return `
            <h2>👥 Referral Program</h2>
            <div class="referral-box" style="flex-direction:column; align-items:start;">
                <div>🔗 ${link}</div>
                <button id="copyFullLinkBtn" class="btn-sm">Copy Link</button>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><h4>Total Referrals</h4><div class="value">${userProfile.referral_count || 0}</div></div>
                <div class="stat-card"><h4>Remaining Slots</h4><div class="value">${100 - (userProfile.referral_count || 0)}</div></div>
                <div class="stat-card"><h4>Referral Bonus Earned</h4><div class="value">₹${userProfile.referral_earnings || 0}</div></div>
                <div class="stat-card"><h4>10% Commission Earned</h4><div class="value">₹${totalCommission}</div></div>
            </div>
            <div style="background:#0f172a; border-radius:20px; padding:1rem; margin:1rem 0;">
                <h3>📋 How It Works</h3>
                <ul style="margin-left:1.5rem; line-height:1.8;">
                    <li>✅ Share your unique referral link.</li>
                    <li>✅ When your friend completes KYC, <strong>you get ₹50</strong> and <strong>they get ₹50</strong>.</li>
                    <li>✅ You also earn <strong>10% commission</strong> from every task reward your referred user earns.</li>
                    <li>✅ You can refer up to <strong>100 users</strong>.</li>
                </ul>
            </div>
            <h3>Your Referrals (${successfulReferrals} completed / ${pendingReferrals} pending)</h3>
            <div>${referredListHtml || '<p>No referrals yet. Share your link!</p>'}</div>`;
        }

        async function renderKyc() {
            const { data: existing } = await supabase.from('verifications').select('*').eq('uid', currentUser.id).order('submitted_at', { ascending: false }).limit(1).maybeSingle();
            if(existing?.status === 'verified') return `<h2>KYC Status</h2><div class="stat-card">✅ Verified! You can withdraw.</div>`;
            if(existing?.status === 'pending') return `<h2>KYC Status</h2><div class="stat-card">⏳ Under review.</div>`;
            return `<h2>📄 Complete KYC</h2>
            <div class="kyc-card"><div class="dropdown-header" data-dropdown="aadhaar"><h3>Aadhaar</h3><i class="fas fa-chevron-down"></i></div><div id="aadhaarContent" class="dropdown-content"><input id="aadhaarNum" placeholder="Aadhaar Number"><div class="file-group"><label>Front</label><input type="file" id="aadFrontDoc" accept="image/*"><img id="previewAadFront" class="image-preview"></div><div class="file-group"><label>Back</label><input type="file" id="aadBackDoc" accept="image/*"><img id="previewAadBack" class="image-preview"></div><div class="file-group"><label>Front Selfie</label><input type="file" id="aadFrontSelfie" accept="image/*"><img id="previewAadFrontSelfie" class="image-preview"></div><div class="file-group"><label>Back Selfie</label><input type="file" id="aadBackSelfie" accept="image/*"><img id="previewAadBackSelfie" class="image-preview"></div></div></div>
            <div class="kyc-card"><div class="dropdown-header" data-dropdown="pan"><h3>PAN</h3><i class="fas fa-chevron-down"></i></div><div id="panContent" class="dropdown-content"><input id="panNum" placeholder="PAN Number"><div class="file-group"><label>Front</label><input type="file" id="panFrontDoc" accept="image/*"><img id="previewPanFront" class="image-preview"></div><div class="file-group"><label>Back</label><input type="file" id="panBackDoc" accept="image/*"><img id="previewPanBack" class="image-preview"></div><div class="file-group"><label>Front Selfie</label><input type="file" id="panFrontSelfie" accept="image/*"><img id="previewPanFrontSelfie" class="image-preview"></div><div class="file-group"><label>Back Selfie</label><input type="file" id="panBackSelfie" accept="image/*"><img id="previewPanBackSelfie" class="image-preview"></div></div></div>
            <div class="kyc-card"><h3>HD Profile Picture</h3><div class="file-group"><input type="file" id="hdProfilePic" accept="image/*"><img id="previewHd" class="image-preview"></div></div>
            <button id="submitKycBtn">Submit KYC</button>`;
        }

        async function submitKyc() {
            const aadhaarNum = document.getElementById('aadhaarNum')?.value;
            const panNum = document.getElementById('panNum')?.value;
            const files = {
                aadFront: document.getElementById('aadFrontDoc')?.files[0],
                aadBack: document.getElementById('aadBackDoc')?.files[0],
                aadFrontSelfie: document.getElementById('aadFrontSelfie')?.files[0],
                aadBackSelfie: document.getElementById('aadBackSelfie')?.files[0],
                panFront: document.getElementById('panFrontDoc')?.files[0],
                panBack: document.getElementById('panBackDoc')?.files[0],
                panFrontSelfie: document.getElementById('panFrontSelfie')?.files[0],
                panBackSelfie: document.getElementById('panBackSelfie')?.files[0],
                hd: document.getElementById('hdProfilePic')?.files[0]
            };
            if(!aadhaarNum || !panNum) return toast("Aadhaar and PAN numbers required","error");
            try {
                const upload = async (file, name) => {
                    if(!file) return null;
                    const path = `${currentUser.id}/kyc/${name}_${Date.now()}.${file.name.split('.').pop()}`;
                    const { data, error } = await supabase.storage.from('kyc_docs').upload(path, file);
                    if(error) throw error;
                    return path;
                };
                const urls = {
                    aadhaar_front: await upload(files.aadFront, 'aadFront'),
                    aadhaar_back: await upload(files.aadBack, 'aadBack'),
                    aadhaar_front_selfie: await upload(files.aadFrontSelfie, 'aadFrontSelfie'),
                    aadhaar_back_selfie: await upload(files.aadBackSelfie, 'aadBackSelfie'),
                    pan_front_doc: await upload(files.panFront, 'panFront'),
                    pan_back_doc: await upload(files.panBack, 'panBack'),
                    pan_front_selfie: await upload(files.panFrontSelfie, 'panFrontSelfie'),
                    pan_back_selfie: await upload(files.panBackSelfie, 'panBackSelfie'),
                    user_hd_pic: await upload(files.hd, 'hd')
                };
                await supabase.from('verifications').insert({
                    uid: currentUser.id,
                    full_name: userProfile.name,
                    aadhaar_number: aadhaarNum,
                    pan_number: panNum,
                    ...urls,
                    status: 'pending'
                });
                toast("KYC submitted! Pending review.","success");
                renderPanel('kyc');
            } catch(e) { toast("Upload failed: "+e.message,"error"); }
        }

        async function renderWithdraw() {
            const { data: methods } = await supabase.from('payment_methods').select('*').eq('uid', currentUser.id);
            return `<h2>💸 Withdraw Funds</h2><div class="stats-grid"><div class="stat-card"><h4>Balance</h4><div class="value">₹${userProfile.balance||0}</div></div></div>
            <h3>Payment Methods</h3><div>${methods?.map(m=>`<div class="payment-method-card"><span class="payment-badge">${m.type}</span> ${m.type==='UPI'?m.details:JSON.parse(m.details).name}<button class="btn-sm deleteMethod" data-id="${m.id}">Delete</button></div>`).join('')||'None'}</div>
            <button id="addMethodBtn" class="btn-sm">+ Add Bank/UPI</button>
            <h3>Request Withdrawal</h3><form id="wdForm"><select id="wdMethod">${methods?.map(m=>`<option value="${m.id}">${m.type} - ${m.details}</option>`).join('')}</select><input type="number" id="wdAmount" placeholder="Amount (Min ₹100)"><button type="submit">Withdraw</button></form>`;
        }

        async function addPaymentMethod() {
            const type = await Swal.fire({title:'Type', input:'select', inputOptions:{UPI:'UPI',bank:'Bank'}});
            if(!type.value) return;
            if(type.value === 'UPI') {
                const { value: upi } = await Swal.fire({title:'UPI ID', input:'text'});
                if(upi) await supabase.from('payment_methods').insert({ uid:currentUser.id, type:'UPI', details:upi });
            } else {
                const { value: form } = await Swal.fire({title:'Bank Details', html:`<input id="bankName" placeholder="Full Name"><input id="bankAccount" placeholder="Account Number"><input id="bankIfsc" placeholder="IFSC">`, preConfirm:()=>({ name:document.getElementById('bankName').value, account:document.getElementById('bankAccount').value, ifsc:document.getElementById('bankIfsc').value })});
                if(form) await supabase.from('payment_methods').insert({ uid:currentUser.id, type:'bank', details:JSON.stringify(form) });
            }
            renderPanel('withdraw');
        }

        async function deletePaymentMethod(id) { await supabase.from('payment_methods').delete().eq('id',id); renderPanel('withdraw'); }
        async function requestWithdrawal(amount, methodId) {
            if(userProfile.verification_status !== 'verified') return toast("Complete KYC first","error");
            if(amount<100) return toast("Min ₹100","error");
            if(amount>userProfile.balance) return toast("Insufficient balance","error");
            const { data: method } = await supabase.from('payment_methods').select('*').eq('id', methodId).single();
            let details = method.details;
            if(method.type === 'bank'){ const d=JSON.parse(details); details = `${d.name}, A/c:${d.account}, IFSC:${d.ifsc}`; }
            await supabase.from('withdrawals').insert({ uid:currentUser.id, amount, method:method.type, details, status:'pending' });
            toast("Request sent!","success");
            renderPanel('withdraw');
        }

        async function renderChat() {
            const { data: msgs } = await supabase.from('support_messages').select('*').or(`uid.eq.${currentUser.id},recipient_uid.eq.${currentUser.id}`).order('created_at');
            return `<h2>💬 Support Chat</h2><div class="chat-box">${msgs?.map(m=>`<div><strong>${m.is_admin?'Admin':'You'}:</strong> ${m.message}</div>`).join('')||'No messages'}</div><div style="display:flex;"><input type="text" id="userChatMsg"><button id="sendMsgBtn">Send</button></div>`;
        }

        let currentTab = 'dashboard';
        async function renderPanel(tab) {
            currentTab = tab;
            const container = document.getElementById('dashboardMain');
            if(tab === 'dashboard') container.innerHTML = await renderDashboard();
            else if(tab === 'tasks') { container.innerHTML = await renderTasks(); attachTaskEvents(); }
            else if(tab === 'referrals') container.innerHTML = await renderReferrals();
            else if(tab === 'kyc') container.innerHTML = await renderKyc();
            else if(tab === 'withdraw') container.innerHTML = await renderWithdraw();
            else if(tab === 'chat') container.innerHTML = await renderChat();
            attachCommonEvents();
        }

        function attachTaskEvents() {
            document.querySelectorAll('.toggleHelpBtn').forEach(btn => btn.addEventListener('click',()=>{ const div = document.getElementById(`help-${btn.dataset.id}`); if(div.style.display==='none'){ div.style.display='block'; btn.textContent='Hide Help'; } else { div.style.display='none'; btn.textContent='Show Help'; } }));
            document.querySelectorAll('.startTaskBtn').forEach(btn => btn.addEventListener('click',()=>startTask(JSON.parse(btn.dataset.task))));
        }

        function attachCommonEvents() {
            document.getElementById('copyCodeBtn')?.addEventListener('click',()=>{ navigator.clipboard.writeText(userProfile.referral_code); toast("Code copied!"); });
            document.getElementById('copyLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
            document.getElementById('copyFullLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
            document.getElementById('submitKycBtn')?.addEventListener('click',submitKyc);
            document.getElementById('addMethodBtn')?.addEventListener('click',addPaymentMethod);
            document.querySelectorAll('.deleteMethod').forEach(btn=>btn.addEventListener('click',async()=>{ await supabase.from('payment_methods').delete().eq('id',btn.dataset.id); renderPanel('withdraw'); }));
            document.getElementById('wdForm')?.addEventListener('submit',async(e)=>{ e.preventDefault(); const methodId = document.getElementById('wdMethod').value; const amount = parseInt(document.getElementById('wdAmount').value); await requestWithdrawal(amount, methodId); });
            document.getElementById('sendMsgBtn')?.addEventListener('click',async()=>{ let msg=document.getElementById('userChatMsg').value; if(msg){ await supabase.from('support_messages').insert({ uid:currentUser.id, message:msg, is_admin:false }); document.getElementById('userChatMsg').value=''; renderPanel('chat'); } });
            const preview = (id, previewId) => { const inp = document.getElementById(id); if(inp) inp.addEventListener('change',(e)=>{ if(e.target.files[0]){ const reader = new FileReader(); reader.onload = ev => { const img = document.getElementById(previewId); if(img) { img.src = ev.target.result; img.style.display='block'; } }; reader.readAsDataURL(e.target.files[0]); } }); };
            preview('aadFrontDoc','previewAadFront'); preview('aadBackDoc','previewAadBack'); preview('aadFrontSelfie','previewAadFrontSelfie'); preview('aadBackSelfie','previewAadBackSelfie');
            preview('panFrontDoc','previewPanFront'); preview('panBackDoc','previewPanBack'); preview('panFrontSelfie','previewPanFrontSelfie'); preview('panBackSelfie','previewPanBackSelfie'); preview('hdProfilePic','previewHd');
            document.querySelectorAll('.dropdown-header').forEach(h=>{ h.addEventListener('click',()=>{ const cont = document.getElementById(h.getAttribute('data-dropdown')+'Content'); cont.classList.toggle('open'); const icon = h.querySelector('i'); if(cont.classList.contains('open')) icon.classList.replace('fa-chevron-down','fa-chevron-up'); else icon.classList.replace('fa-chevron-up','fa-chevron-down'); }); });
        }

        function renderFullDashboard() {
            return `
            <div class="dashboard-container">
                <div class="sidebar">
                    <div class="logo">🎮 GAMELOOT</div>
                    <div class="nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div>
                    <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Earn Tasks</span></div>
                    <div class="nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Referrals</span></div>
                    <div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
                    <div class="nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
                    <div class="nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Support</span></div>
                    <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
                </div>
                <div class="main-panel" id="dashboardMain"></div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Home</span></div>
                <div class="bottom-nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Tasks</span></div>
                <div class="bottom-nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Refer</span></div>
                <div class="bottom-nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div>
                <div class="bottom-nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div>
                <div class="bottom-nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Chat</span></div>
            </div>`;
        }

        function initDashboard() {
            const root = document.getElementById('root');
            root.innerHTML = renderFullDashboard();
            renderPanel('dashboard');
            document.querySelectorAll('.nav-item[data-tab], .bottom-nav-item[data-tab]').forEach(el => {
                el.addEventListener('click', () => {
                    const tab = el.getAttribute('data-tab');
                    document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(n => n.classList.remove('active'));
                    document.querySelectorAll(`.nav-item[data-tab="${tab}"], .bottom-nav-item[data-tab="${tab}"]`).forEach(n => n.classList.add('active'));
                    renderPanel(tab);
                });
            });
            document.getElementById('logoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
        }

        function renderHeroPage() {
            return `
            <div class="top-bar">
                <div class="logo">🎮 GAMELOOT</div>
                <div class="auth-buttons">
                    <button id="heroSignInBtn" class="btn-outline">Sign In</button>
                    <button id="heroSignUpBtn" class="btn-primary">Sign Up</button>
                </div>
            </div>
            <div class="hero">
                <h1>Work Small, Earn Big</h1>
                <p>Complete simple tasks, get rewarded instantly. Join thousands earning daily with GameLoot.</p>
                <div class="hero-buttons">
                    <button id="heroGetStarted" class="btn-primary">Get Started →</button>
                    <button id="heroLoginBtn" class="btn-outline">I already have an account</button>
                </div>
                <div class="feature-cards">
                    <div class="feature-card"><i class="fas fa-tasks"></i><h3>Micro Tasks</h3><p>Earn ₹10–500 per task</p></div>
                    <div class="feature-card"><i class="fas fa-wallet"></i><h3>Fast Withdrawals</h3><p>UPI, Bank, Crypto</p></div>
                    <div class="feature-card"><i class="fas fa-users"></i><h3>Referral Bonuses</h3><p>₹50 + 10% commission</p></div>
                </div>
            </div>`;
        }

        // ---------- Main Auth Check ----------
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            document.getElementById('root').innerHTML = renderHeroPage();
            document.getElementById('heroSignUpBtn')?.addEventListener('click', showSignUpModal);
            document.getElementById('heroGetStarted')?.addEventListener('click', showSignUpModal);
            document.getElementById('heroSignInBtn')?.addEventListener('click', showSignInModal);
            document.getElementById('heroLoginBtn')?.addEventListener('click', showSignInModal);
            return;
        }
        currentUser = user;
        if (!user.email_confirmed_at) {
            document.getElementById('root').innerHTML = `<div class="hero"><h2>Email not verified</h2><p>Please check your inbox and click the verification link.</p><button id="resendBtn" class="btn-primary">Resend verification email</button></div>`;
            document.getElementById('resendBtn')?.addEventListener('click', async () => { await supabase.auth.resend({ type: 'signup', email: user.email }); toast("Verification email resent!","success"); });
            return;
        }
        try {
            userProfile = await ensureProfile(user.id, user.email, user.user_metadata?.name);
            const ref = new URLSearchParams(window.location.search).get('ref');
            if (ref && !userProfile.referred_by) {
                await supabase.from('profiles').update({ referred_by: ref }).eq('id', user.id);
                toast("Referral code applied!","success");
            }
            initDashboard();
        } catch(err) {
            document.getElementById('root').innerHTML = `<div class="hero"><h2>Error</h2><p>${err.message}</p><button class="btn-primary" onclick="location.reload()">Retry</button></div>`;
            console.error(err);
        }
    })();
</script>
</body>
</html>
