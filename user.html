<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GameLoot | Work Small, Earn Big</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (same as the previous engaging user.html – keep the button styles and layout) */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0b0e17; color:#eef5ff; overflow-x:hidden; }
        /* ... include all the styles from the latest user.html with button enhancements ... */
    </style>
</head>
<body>
<div id="root"></div>

<script>
    (async function(){
        const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null, userProfile = null;
        function toast(msg, icon='info'){ Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:3000}); }
        function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

        // ==================== AUTH & PROFILE (unchanged) ====================
        async function ensureProfile(userId, email, metadataName) { /* same as before */ }
        async function showSignUpModal() { /* same */ }
        async function showSignInModal() { /* same */ }
        // ... (keep all the existing dashboard, leaderboard, notifications, referrals, KYC, withdraw, chat functions)
        // For brevity, I will only highlight the new task submission flow.

        // ==================== TASKS (with custom fields & file uploads) ====================
        async function renderTasks() {
            const { data: tasks } = await supabase.from('tasks').select('*');
            if (!tasks || tasks.length === 0) return `<h2>Available Tasks</h2><p>No tasks yet. Admin will add soon.</p>`;
            let html = `<h2>🔥 Available Tasks</h2><div class="tasks-container">`;
            for (const task of tasks) {
                html += `
                    <div class="task-card" data-task='${JSON.stringify(task)}'>
                        <h3>${escapeHtml(task.title)}</h3>
                        <p>${escapeHtml(task.description).substring(0, 80)}${(task.description && task.description.length > 80) ? '...' : ''}</p>
                        <div class="reward-badge">+₹${task.reward}</div>
                        <div class="task-footer">
                            <span><i class="fas fa-tag"></i> ${task.category || 'General'}</span>
                            ${task.deadline ? `<span><i class="fas fa-hourglass-half"></i> ${new Date(task.deadline).toLocaleDateString()}</span>` : ''}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            return html;
        }

        async function showTaskDetailModal(task) {
            const { data: existing } = await supabase.from('submissions').select('id, status, rejection_reason, admin_feedback').eq('uid', currentUser.id).eq('task_id', task.id).maybeSingle();
            let statusMessage = '', canStart = true;
            if (existing?.status === 'pending') { statusMessage = '<div class="status-pending" style="padding:0.5rem; border-radius:12px;">⏳ You have already submitted this task. Pending admin approval.</div>'; canStart = false; }
            if (existing?.status === 'approved') { statusMessage = '<div class="status-approved" style="padding:0.5rem; border-radius:12px;">✅ You have already completed this task and received the reward.</div>'; canStart = false; }
            if (existing?.status === 'rejected') { statusMessage = `<div class="status-rejected" style="padding:0.5rem; border-radius:12px;">❌ Your previous submission was rejected.<br>Reason: ${existing.admin_feedback || existing.rejection_reason || 'Not provided'}<br>You can try again.</div>`; canStart = true; }

            let countdownHtml = '';
            if (task.deadline) countdownHtml = `<div class="countdown-large" id="modalCountdown"></div>`;

            const modalContent = `
                <div class="task-modal-content">
                    <h2>${escapeHtml(task.title)}</h2>
                    <div class="reward-badge" style="font-size:1.2rem;">+₹${task.reward}</div>
                    <p><strong>Description:</strong><br>${escapeHtml(task.description)}</p>
                    <div class="help-text"><i class="fas fa-info-circle"></i> Help & Instructions:<br>${task.help_text || 'No additional help provided.'}</div>
                    ${countdownHtml}
                    ${statusMessage}
                    <div class="modal-btn-group">
                        ${task.link ? `<button id="modalVisitLinkBtn" class="btn-primary btn-visit"><i class="fas fa-external-link-alt"></i> Visit Task Link</button>` : ''}
                        ${canStart ? `<button id="modalStartTaskBtn" class="btn-primary btn-start"><i class="fas fa-play"></i> Start Task & Submit</button>` : '<button disabled style="opacity:0.5;">Already Submitted</button>'}
                    </div>
                    <button id="modalCloseBtn" class="btn-close-modal"><i class="fas fa-times"></i> Close</button>
                </div>
            `;
            Swal.fire({ title: 'Task Details', html: modalContent, showConfirmButton: false, showCancelButton: false, didOpen: () => {
                if (task.deadline) { /* countdown logic same as before */ }
                document.getElementById('modalVisitLinkBtn')?.addEventListener('click', () => window.open(task.link,'_blank'));
                document.getElementById('modalStartTaskBtn')?.addEventListener('click', async () => { Swal.close(); await startTask(task); });
                document.getElementById('modalCloseBtn')?.addEventListener('click', () => Swal.close());
            } });
        }

        async function startTask(task) {
            const { data: existing } = await supabase.from('submissions').select('id, status, submission_data').eq('uid', currentUser.id).eq('task_id', task.id).maybeSingle();
            if(existing?.status === 'pending') return toast("Already pending.", "warning");
            if(existing?.status === 'approved') return toast("Already completed!", "success");
            let fieldsHtml = '';
            const prevData = existing?.submission_data || {};
            for(const f of (task.custom_fields || [])) {
                const prevValue = prevData[f.label] || '';
                if(f.type === 'file') {
                    fieldsHtml += `<div style="margin-bottom:1rem;">
                        <label>${f.label} ${f.required?'*':''}</label>
                        <input type="file" id="field_${f.label.replace(/\s/g,'_')}" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,.txt" ${f.required?'required':''}>
                        ${prevValue ? `<div><small>Previously uploaded: <a href="${await getSignedUrl(prevValue, 'task_submissions')}" target="_blank">View previous file</a></small></div>` : ''}
                    </div>`;
                } else {
                    fieldsHtml += `<div style="margin-bottom:1rem;">
                        <label>${f.label} ${f.required?'*':''}</label>
                        <input type="${f.type}" id="field_${f.label.replace(/\s/g,'_')}" value="${escapeHtml(prevValue)}" ${f.required?'required':''}>
                    </div>`;
                }
            }
            const { value: formData } = await Swal.fire({
                title: task.title,
                html: `<div><p>${task.description}</p><p>Reward: ₹${task.reward}</p>${task.link ? `<a href="${task.link}" target="_blank">Open Task Link</a><br>` : ''}<div class="help-content">${task.help_text||''}</div><hr>${fieldsHtml}</div>`,
                width: '700px',
                preConfirm: async () => {
                    let submissionData = {};
                    for(const f of (task.custom_fields || [])) {
                        const input = document.getElementById(`field_${f.label.replace(/\s/g,'_')}`);
                        if(f.type === 'file') {
                            const file = input.files[0];
                            if(f.required && !file && !prevData[f.label]) { Swal.showValidationMessage(`${f.label} is required`); return false; }
                            if(file) {
                                const ext = file.name.split('.').pop();
                                const allowed = ['jpg','jpeg','png','pdf','doc','docx','txt'];
                                if(!allowed.includes(ext.toLowerCase())) { Swal.showValidationMessage(`${f.label}: only images, PDF, DOC, TXT allowed`); return false; }
                                const path = `task_submissions/${currentUser.id}/${task.id}/${Date.now()}_${file.name}`;
                                const { error } = await supabase.storage.from('task_submissions').upload(path, file);
                                if(error) { Swal.showValidationMessage(error.message); return false; }
                                submissionData[f.label] = path;
                            } else if(prevData[f.label]) {
                                submissionData[f.label] = prevData[f.label];
                            }
                        } else {
                            const val = input.value;
                            if(f.required && !val) { Swal.showValidationMessage(`${f.label} is required`); return false; }
                            submissionData[f.label] = val;
                        }
                    }
                    return { submissionData };
                }
            });
            if(formData) {
                if(existing?.id) {
                    await supabase.from('submissions').update({ submission_data: formData.submissionData, status: 'pending', admin_feedback: null }).eq('id', existing.id);
                } else {
                    await supabase.from('submissions').insert({ uid: currentUser.id, task_id: task.id, submission_data: formData.submissionData, status: 'pending', reward: task.reward });
                }
                toast("Task submitted for review!", "success");
                renderPanel('tasks');
            }
        }

        async function getSignedUrl(path, bucket = 'task_submissions') {
            if (!path) return null;
            const { data, error } = await supabase.storage.from(bucket).createSignedUrl(path, 3600);
            if (error) return null;
            return data.signedUrl;
        }

        // ==================== MY SUBMISSIONS (with feedback) ====================
        async function renderMySubmissions() {
            const { data: submissions, error } = await supabase
                .from('submissions')
                .select('*, tasks(title, reward, custom_fields)')
                .eq('uid', currentUser.id)
                .order('created_at', { ascending: false });
            if (error) return `<h2>My Submissions</h2><p>Error loading.</p>`;
            if (!submissions || submissions.length === 0) return `<h2>My Submissions</h2><p>No submissions yet.</p>`;
            let html = `<h2>My Submissions</h2>`;
            for (const sub of submissions) {
                const task = sub.tasks;
                const statusClass = sub.status === 'approved' ? 'status-approved' : (sub.status === 'pending' ? 'status-pending' : 'status-rejected');
                const statusText = sub.status === 'approved' ? '✅ Approved' : (sub.status === 'pending' ? '⏳ Pending' : '❌ Rejected');
                let feedbackHtml = '';
                if (sub.status === 'rejected' && sub.admin_feedback) {
                    feedbackHtml = `<div class="rejection-reason"><strong>Admin feedback:</strong> ${escapeHtml(sub.admin_feedback)}</div>`;
                }
                html += `<div class="submission-card" data-submission='${JSON.stringify(sub)}' data-task='${JSON.stringify(task)}'>
                    <div style="display:flex; justify-content:space-between;"><h3>${escapeHtml(task?.title)}</h3><span class="status-badge ${statusClass}">${statusText}</span></div>
                    <div class="reward-badge">+₹${sub.reward}</div>
                    <div><small>Submitted: ${new Date(sub.created_at).toLocaleString()}</small></div>
                    ${feedbackHtml}
                    <div class="flex-btns" style="margin-top:1rem;"><button class="btn-sm viewSubmissionBtn">View Details</button></div>
                </div>`;
            }
            return html;
        }

        async function viewSubmissionDetails(submission, task) {
            if (!task) return toast("Task no longer exists", "error");
            let fieldsHtml = '';
            if (submission.submission_data && task.custom_fields) {
                for (const field of task.custom_fields) {
                    const value = submission.submission_data[field.label];
                    if (field.type === 'file' && value) {
                        const signedUrl = await getSignedUrl(value);
                        fieldsHtml += `<div><strong>${field.label}:</strong> <a href="${signedUrl}" target="_blank">📎 View File</a></div>`;
                    } else {
                        fieldsHtml += `<div><strong>${field.label}:</strong> ${value || '-'}</div>`;
                    }
                }
            } else {
                fieldsHtml = `<div>No data submitted.</div>`;
            }
            let feedbackNote = '';
            if (submission.status === 'rejected' && submission.admin_feedback) {
                feedbackNote = `<div style="background:#7f1a1a40; padding:1rem; border-radius:16px; margin-top:1rem;"><strong>Admin Feedback:</strong> ${escapeHtml(submission.admin_feedback)}</div>`;
            }
            Swal.fire({
                title: `Submission: ${task.title}`,
                html: `<div style="text-align:left;"><p><strong>Status:</strong> ${submission.status.toUpperCase()}</p><p><strong>Reward:</strong> ₹${submission.reward}</p><p><strong>Submitted:</strong> ${new Date(submission.created_at).toLocaleString()}</p><hr><h4>Your answers:</h4>${fieldsHtml}${feedbackNote}</div>`,
                confirmButtonText: 'Close'
            });
        }

        // ==================== DASHBOARD RENDERING (same as final version) ====================
        // ... include existing dashboard, referrals, KYC, withdraw, chat, leaderboard functions
        // For brevity, I will assume they are present (they were in the previous final user.html)
        // In the final delivered file, I will include all of them unchanged.

        let currentTab = 'dashboard';
        async function renderPanel(tab) {
            const container = document.getElementById('dashboardMain');
            if(tab === 'dashboard') container.innerHTML = await renderDashboard();
            else if(tab === 'tasks') { container.innerHTML = await renderTasks(); attachTaskEvents(); }
            else if(tab === 'submissions') container.innerHTML = await renderMySubmissions(); attachSubmissionEvents();
            else if(tab === 'referrals') container.innerHTML = await renderReferrals();
            else if(tab === 'kyc') container.innerHTML = await renderKyc();
            else if(tab === 'withdraw') container.innerHTML = await renderWithdraw();
            else if(tab === 'leaderboard') container.innerHTML = await renderLeaderboard();
            else if(tab === 'chat') container.innerHTML = await renderChat();
            attachCommonEvents();
        }

        function attachTaskEvents() {
            document.querySelectorAll('.task-card').forEach(card => card.addEventListener('click', () => showTaskDetailModal(JSON.parse(card.dataset.task))));
        }
        function attachSubmissionEvents() {
            document.querySelectorAll('.viewSubmissionBtn').forEach(btn => {
                const card = btn.closest('.submission-card');
                const submission = JSON.parse(card.dataset.submission);
                const task = JSON.parse(card.dataset.task);
                btn.addEventListener('click', () => viewSubmissionDetails(submission, task));
            });
        }

        // ==================== INIT ====================
        // ... same auth check and init functions
    })();
</script>
</body>
</html>
