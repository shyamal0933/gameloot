<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GameLoot | Work Small, Earn Big</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0b0e17;color:#eef5ff;overflow-x:hidden;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1.5rem;background:rgba(10,14,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,242,254,0.3);position:sticky;top:0;z-index:100;}
        .logo{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .right-actions{display:flex;gap:15px;align-items:center;}
        .notif-bell{position:relative;cursor:pointer;font-size:1.3rem;color:#a0abcf;}
        .notif-bell:hover{color:#00f2fe;transform:scale(1.05);}
        .notif-badge{position:absolute;top:-8px;right:-8px;background:#ef4444;color:white;border-radius:50%;padding:2px 6px;font-size:0.7rem;}
        .logout-btn{background:linear-gradient(95deg,#dc2626,#b91c1c);border:none;padding:6px 18px;border-radius:40px;color:white;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 6px rgba(220,38,38,0.3);}
        .logout-btn:hover{transform:translateY(-2px);background:linear-gradient(95deg,#b91c1c,#991b1b);box-shadow:0 4px 12px rgba(220,38,38,0.4);}
        @media (max-width:768px){.top-bar{padding:0.6rem 1rem;}.logo{font-size:1.2rem;}.logout-btn{padding:4px 12px;font-size:0.75rem;}}
        button, .btn-primary, .btn-outline, .btn-sm, .btn-visit, .btn-start, .btn-close-modal, .referral-box button, .copy-btn {
            cursor: pointer; transition: all 0.2s ease; border: none; border-radius: 60px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
        }
        .btn-primary, .startTaskBtn, .submitBtn, .btn-start, #submitKycBtn, #wdForm button, .heroSignUpBtn, .heroGetStarted {
            background: linear-gradient(95deg, #0055ff, #00c3ff); color: white; padding: 12px 28px; font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(0,195,255,0.3);
        }
        .btn-primary:hover, .startTaskBtn:hover, .submitBtn:hover, .btn-start:hover, #submitKycBtn:hover, #wdForm button:hover {
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,195,255,0.5);
            background: linear-gradient(95deg,#0044dd,#00aaff);
        }
        .btn-outline, .modalCloseBtn, .heroLoginBtn, .signInBtn {
            background: transparent; border: 1px solid #00f2fe; color: #00f2fe; padding: 10px 24px;
        }
        .btn-outline:hover{background:rgba(0,242,254,0.1);transform:scale(1.02);box-shadow:0 0 12px rgba(0,242,254,0.4);}
        .btn-sm, .copyCodeBtn, .copyLinkBtn, .copyFullLinkBtn, .deleteMethod, .viewSubmissionBtn, .toggleHelpBtn {
            background:#1e2a47; color:white; padding:8px 18px; font-size:0.8rem;
        }
        .btn-sm:hover{background:#2a3a60;transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.3);}
        .btn-visit, .visitTaskBtn{background:linear-gradient(95deg,#2d3748,#1a202c);border:1px solid #00f2fe;color:#00f2fe;padding:10px 24px;}
        .btn-visit:hover{background:#1a202c;box-shadow:0 0 12px rgba(0,242,254,0.4);transform:scale(1.02);}
        .btn-close-modal, .closeBtn{background:#2d3748;color:white;padding:10px 24px;}
        .btn-close-modal:hover{background:#4a5568;}
        button:disabled{opacity:0.5;transform:none;cursor:not-allowed;box-shadow:none;}
        button i{transition:transform 0.2s;}
        button:hover i{transform:translateX(4px) scale(1.1);}
        @media (max-width:768px){
            .btn-primary, .startTaskBtn, .submitBtn, .btn-start, #submitKycBtn, #wdForm button{padding:10px 20px;font-size:0.9rem;}
            .btn-sm, .copyCodeBtn, .copyLinkBtn, .copyFullLinkBtn, .deleteMethod, .viewSubmissionBtn{padding:6px 14px;}
        }
        .hero{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;}
        .hero h1{font-size:3rem;font-weight:800;background:linear-gradient(135deg,#fff,#00f2fe);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:1rem;}
        .hero p{font-size:1.2rem;color:#a0abcf;max-width:600px;margin-bottom:2rem;}
        .feature-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem;margin-top:4rem;width:100%;max-width:1000px;}
        .feature-card{background:rgba(20,28,45,0.7);backdrop-filter:blur(8px);border-radius:28px;padding:1.5rem;border:1px solid rgba(0,255,255,0.2);}
        .feature-card i{font-size:2rem;color:#00f2fe;margin-bottom:1rem;}
        .dashboard-container{display:flex;min-height:100vh;}
        .sidebar{width:280px;background:rgba(15,20,35,0.95);backdrop-filter:blur(16px);border-right:1px solid rgba(0,242,254,0.25);padding:2rem 1rem;position:fixed;height:100vh;overflow-y:auto;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:6px 0;border-radius:40px;cursor:pointer;color:#a0abcf;transition:0.2s;}
        .nav-item i{width:26px;}
        .nav-item.active,.nav-item:hover{background:rgba(0,242,254,0.12);color:#00f2fe;}
        .main-panel{flex:1;margin-left:280px;padding:2rem;transition:margin 0.3s;}
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;width:100%;background:rgba(10,14,23,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(0,242,254,0.3);padding:10px 16px;justify-content:space-around;z-index:200;}
        .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8e9acf;font-size:0.7rem;cursor:pointer;}
        .bottom-nav-item i{font-size:1.4rem;}
        .bottom-nav-item.active{color:#00f2fe;}
        @media (max-width:768px){.sidebar{transform:translateX(-100%);}.main-panel{margin-left:0;padding:1rem 1rem 80px 1rem;}.bottom-nav{display:flex;}.hero h1{font-size:2rem;}}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;}
        .stat-card{background:rgba(20,28,45,0.7);backdrop-filter:blur(8px);border-radius:28px;padding:1.2rem;border:1px solid rgba(0,255,255,0.2);}
        .stat-card h4{font-size:0.8rem;color:#8e9acf;}
        .stat-card .value{font-size:1.8rem;font-weight:700;}
        .tasks-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;margin-top:1rem;}
        .task-card{background:linear-gradient(135deg,#111827 0%,#0f172a 100%);border-radius:28px;padding:1.5rem;border:1px solid rgba(0,242,254,0.2);transition:all 0.3s ease;cursor:pointer;position:relative;overflow:hidden;}
        .task-card:hover{transform:translateY(-5px);border-color:#00f2fe;box-shadow:0 10px 25px -5px rgba(0,242,254,0.2);}
        .task-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#00f2fe,#4facfe);}
        .task-card h3{font-size:1.3rem;margin-bottom:0.5rem;color:#fff;}
        .task-card p{color:#a0abcf;margin-bottom:1rem;line-height:1.4;}
        .reward-badge{background:rgba(0,242,254,0.15);color:#00f2fe;padding:4px 12px;border-radius:40px;display:inline-block;margin:8px 0;font-weight:600;}
        .task-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;font-size:0.8rem;color:#8e9acf;}
        .submission-card{background:#111827;border-radius:24px;padding:1.2rem;margin-bottom:1rem;border:1px solid #2a3448;}
        .submission-card:hover{border-color:#00f2fe;}
        .status-badge{display:inline-block;padding:4px 12px;border-radius:40px;font-size:0.7rem;font-weight:bold;}
        .status-approved{background:#10b98120;color:#10b981;}
        .status-pending{background:#f59e0b20;color:#f59e0b;}
        .status-rejected{background:#ef444420;color:#ef4444;}
        .rejection-reason{background:#7f1a1a40;border-radius:12px;padding:0.5rem;margin-top:0.5rem;font-size:0.8rem;}
        .help-text{background:#0f1222;border-radius:20px;padding:1rem;margin:1rem 0;border-left:4px solid #00f2fe;}
        .countdown-large{font-size:1.2rem;font-weight:bold;background:#00000060;display:inline-block;padding:0.2rem 1rem;border-radius:40px;margin:1rem 0;}
        .kyc-card,.payment-method-card{background:rgba(12,18,28,0.8);border-radius:32px;padding:1rem;margin-bottom:1rem;border:1px solid #2a3a5a;}
        .dropdown-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px;background:#0a0f1a;border-radius:60px;margin-bottom:1rem;}
        .dropdown-content{display:none;padding:0.5rem 0;}
        .dropdown-content.open{display:block;}
        .file-group{margin-bottom:1rem;background:#131c2c;padding:10px;border-radius:20px;}
        input,textarea,select{background:#1e293b;border:1px solid #334155;border-radius:28px;padding:12px;width:100%;color:white;}
        .image-preview{width:70px;height:70px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid cyan;display:none;}
        .chat-box{height:280px;overflow-y:auto;background:#0f1222;border-radius:24px;padding:1rem;margin-bottom:1rem;}
        .leaderboard-card{background:#0f172a;border-radius:24px;padding:1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}
        .rank{font-size:1.5rem;font-weight:bold;color:#00f2fe;width:50px;}
        .modal-btn-group{display:flex;gap:1rem;margin:1.5rem 0;flex-wrap:wrap;}
        /* Modern Auth Modal Styles */
        .modern-auth-modal {
            background: rgba(15, 25, 45, 0.98) !important;
            backdrop-filter: blur(20px);
            border-radius: 32px !important;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            width: 450px;
            max-width: 90%;
        }
        .modern-auth-modal .swal2-title {
            color: #00f2fe;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .modern-auth-modal .swal2-html-container {
            padding: 0.5rem 1rem 1rem;
        }
        .modern-auth-modal input, .modern-auth-modal select {
            background: #0f172a;
            border: 1px solid #2a3a5a;
            border-radius: 60px;
            padding: 12px 20px;
            margin: 12px 0;
            width: 100%;
            color: white;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .modern-auth-modal input:focus, .modern-auth-modal select:focus {
            border-color: #00f2fe;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0,242,254,0.2);
        }
        .modern-auth-modal .swal2-confirm {
            background: linear-gradient(95deg, #0055ff, #00c3ff) !important;
            border-radius: 60px !important;
            padding: 12px 24px !important;
            font-size: 1rem !important;
            font-weight: bold !important;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        .modern-auth-modal .swal2-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,195,255,0.4);
        }
        .modern-auth-modal .swal2-cancel {
            background: transparent !important;
            border: 1px solid #00f2fe !important;
            color: #00f2fe !important;
            border-radius: 60px !important;
            padding: 12px 24px !important;
            width: 100%;
            margin-top: 8px;
        }
        .modern-auth-modal .swal2-cancel:hover {
            background: rgba(0,242,254,0.1) !important;
        }
        @media (max-width: 500px) {
            .modern-auth-modal { width: 90% !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    (function(){
        const SUPABASE_URL = "https://kyvtlfatjtbpwemwtqof.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dnRsZmF0anRicHdlbXd0cW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzM1NDcsImV4cCI6MjA5NTgwOTU0N30.v_cHWMwXIfUZzedCnh6B-KPCGEFjJbld1PvRuDXqKIQ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null, userProfile = null, unreadCount = 0;
        function toast(msg, icon='info'){ Swal.fire({toast:true,position:'top-end',icon,title:msg,showConfirmButton:false,timer:3000}); }
        function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

        // ==================== MODERN AUTH MODALS ====================
        async function showSignUpModal() {
            const { value: form } = await Swal.fire({
                title: '✨ Create Account',
                html: `<div style="text-align:left">
                    <input id="signupName" placeholder="Full Name" autocomplete="name" class="swal2-input">
                    <input id="signupEmail" placeholder="Email" type="email" autocomplete="email" class="swal2-input">
                    <input id="signupPassword" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password" class="swal2-input">
                    <input id="signupRef" placeholder="Referral Code (optional)" class="swal2-input">
                </div>`,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '🚀 Sign Up',
                cancelButtonText: 'Cancel',
                customClass: { popup: 'modern-auth-modal' },
                preConfirm: () => {
                    const name = document.getElementById('signupName').value.trim();
                    const email = document.getElementById('signupEmail').value.trim();
                    const password = document.getElementById('signupPassword').value;
                    const ref = document.getElementById('signupRef').value.trim();
                    if (!name || !email || !password) {
                        Swal.showValidationMessage('All fields required');
                        return false;
                    }
                    if (password.length < 6) {
                        Swal.showValidationMessage('Password must be at least 6 characters');
                        return false;
                    }
                    return { name, email, password, ref };
                }
            });
            if (form) {
                const fingerprint = getFingerprint();
                const ip = await getIP();
                const { error } = await supabase.auth.signUp({
                    email: form.email,
                    password: form.password,
                    options: { data: { name: form.name, referral: form.ref, signup_ip: ip, fingerprint } }
                });
                if (error) toast(error.message, "error");
                else {
                    toast("📧 Verification email sent! Check your inbox (and spam).", "success");
                    showSignInModal();
                }
            }
        }

        async function showSignInModal() {
            const { value: form } = await Swal.fire({
                title: '👋 Welcome Back',
                html: `<div style="text-align:left">
                    <input id="loginEmail" placeholder="Email" type="email" autocomplete="email" class="swal2-input">
                    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" class="swal2-input">
                </div>`,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Sign In',
                cancelButtonText: 'Cancel',
                customClass: { popup: 'modern-auth-modal' },
                preConfirm: () => {
                    const email = document.getElementById('loginEmail').value.trim();
                    const password = document.getElementById('loginPassword').value;
                    if (!email || !password) {
                        Swal.showValidationMessage('Email and password required');
                        return false;
                    }
                    return { email, password };
                }
            });
            if (form) {
                const { error } = await supabase.auth.signInWithPassword({ email: form.email, password: form.password });
                if (error) toast(error.message, "error");
                else location.reload();
            }
        }

        // Notifications, leaderboard, fingerprint, IP, ensureProfile (same as before)
        async function fetchNotifications() { const { data } = await supabase.from('notifications').select('*').eq('uid', currentUser.id).order('created_at',{ascending:false}).limit(20); unreadCount = data?.filter(n=>!n.is_read).length||0; updateNotifBell(); return data||[]; }
        async function markAsRead(notifId) { await supabase.from('notifications').update({is_read:true}).eq('id',notifId); await fetchNotifications(); }
        function updateNotifBell() { const bell = document.querySelector('.notif-bell'); if(bell){ let badge = bell.querySelector('.notif-badge'); if(unreadCount>0){ if(!badge) bell.insertAdjacentHTML('beforeend',`<span class="notif-badge">${unreadCount}</span>`); else badge.textContent=unreadCount; } else if(badge) badge.remove(); } }
        async function showNotifications() { const notifs = await fetchNotifications(); let html = `<div style="padding:0.5rem;"><h3>Notifications</h3>`; if(notifs.length===0) html+=`<p>No notifications</p>`; else { for(const n of notifs){ html+=`<div class="notif-item" data-id="${n.id}"><strong>${escapeHtml(n.title)}</strong><br><small>${escapeHtml(n.message)}</small><br><small>${new Date(n.created_at).toLocaleString()}</small></div>`; } } html+=`</div>`; Swal.fire({title:'Notifications',html,confirmButtonText:'Close',didOpen:()=>{ document.querySelectorAll('.notif-item').forEach(el=>{ el.addEventListener('click',async()=>{ await markAsRead(el.dataset.id); Swal.close(); showNotifications(); }); }); } }); }
        async function renderLeaderboard() { const { data: users } = await supabase.from('profiles').select('name,email,balance,referral_earnings,total_earnings').order('total_earnings',{ascending:false}).limit(20); return `<h2>🏆 Leaderboard - Top Earners</h2><div>${users?.map((u,idx)=>`<div class="leaderboard-card"><div class="rank">#${idx+1}</div><div><strong>${escapeHtml(u.name||u.email)}</strong><br>Total: ₹${u.total_earnings||0}</div><div>Balance: ₹${u.balance}<br>Referral: ₹${u.referral_earnings}</div></div>`).join('')||'<p>No users yet.</p>'}</div>`; }
        function getFingerprint() { let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d'); ctx.textBaseline="top"; ctx.font="14px 'Arial'"; ctx.fillStyle="#f60"; ctx.fillRect(125,1,62,20); ctx.fillStyle="#069"; ctx.fillText("GameLoot",2,15); return canvas.toDataURL().substring(0,100); }
        async function getIP() { try { const res = await fetch('https://api.ipify.org?format=json'); const data = await res.json(); return data.ip; } catch(e){ return 'unknown'; } }
        async function ensureProfile(userId, email, metadataName) {
            let { data: profile, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (error && error.code === 'PGRST116') {
                const name = metadataName || email.split('@')[0];
                const fingerprint = getFingerprint(); const ip = await getIP();
                const newProfile = { id:userId, email, name, balance:0, verification_status:'pending', referral_code:'GL'+Math.random().toString(36).substring(2,8).toUpperCase(), total_referrals:0, referral_earnings:0, fraud_score:0, account_status:'active', is_admin:false, created_at:new Date(), referral_count:0, referral_kyc_bonus_paid:false, kyc_bonus_received:false, total_earnings:0 };
                await supabase.from('profiles').insert(newProfile);
                await supabase.from('user_activity').insert({ uid:userId, signup_ip:ip, device_fingerprint:fingerprint, created_at:new Date() });
                profile = newProfile;
            } else if (error) throw error;
            const ip = await getIP();
            await supabase.from('user_activity').update({ last_login_ip:ip, ip_address:ip, user_agent:navigator.userAgent }).eq('uid',userId);
            await supabase.from('profiles').update({ last_login_at:new Date() }).eq('id',userId);
            return profile;
        }

        // Dashboard
        async function renderDashboard() {
            const { data: submissions } = await supabase.from('submissions').select('status').eq('uid', currentUser.id);
            const total = submissions?.length||0; const completed = submissions?.filter(s=>s.status==='approved').length||0;
            return `<h2>Welcome, ${escapeHtml(userProfile.name||'Explorer')} 🎯</h2><div class="stats-grid">
                <div class="stat-card"><h4>💰 Balance</h4><div class="value">₹${userProfile.balance||0}</div></div>
                <div class="stat-card"><h4>✅ KYC</h4><div class="value">${userProfile.verification_status?.toUpperCase()}</div></div>
                <div class="stat-card"><h4>📋 Tasks</h4><div class="value">${total}</div></div>
                <div class="stat-card"><h4>✔️ Done</h4><div class="value">${completed}</div></div>
                <div class="stat-card"><h4>👥 Referrals</h4><div class="value">${userProfile.referral_count||0}</div></div>
                <div class="stat-card"><h4>🏆 Referral Earnings</h4><div class="value">₹${userProfile.referral_earnings||0}</div></div>
            </div><div class="referral-box"><span><i class="fas fa-link"></i> Your Code: <strong>${userProfile.referral_code}</strong></span><button id="copyCodeBtn" class="btn-sm">Copy Code</button><button id="copyLinkBtn" class="btn-sm">Copy Link</button></div>`;
        }

        // ==================== TASKS (unchanged – full clickable cards) ====================
        async function getSignedUrl(path, bucket='task_submissions') { if(!path) return null; const { data, error } = await supabase.storage.from(bucket).createSignedUrl(path,3600); if(error) return null; return data.signedUrl; }
        async function renderTasks() {
            const { data: tasks } = await supabase.from('tasks').select('*');
            if(!tasks||tasks.length===0) return `<h2>Available Tasks</h2><p>No tasks yet. Admin will add soon.</p>`;
            let html = `<h2>🔥 Available Tasks</h2><div class="tasks-container">`;
            for(const task of tasks){
                html += `<div class="task-card" data-task='${JSON.stringify(task)}'><h3>${escapeHtml(task.title)}</h3><p>${escapeHtml(task.description).substring(0,80)}${(task.description&&task.description.length>80)?'...':''}</p><div class="reward-badge">+₹${task.reward}</div><div class="task-footer"><span><i class="fas fa-tag"></i> ${task.category||'General'}</span>${task.deadline?`<span><i class="fas fa-hourglass-half"></i> ${new Date(task.deadline).toLocaleDateString()}</span>`:''}</div></div>`;
            }
            html += `</div>`;
            return html;
        }
        async function showTaskDetailModal(task) {
            const { data: existing } = await supabase.from('submissions').select('id,status,rejection_reason,admin_feedback').eq('uid',currentUser.id).eq('task_id',task.id).maybeSingle();
            let statusMessage='', canStart=true;
            if(existing?.status==='pending'){ statusMessage='<div style="background:#f59e0b20;padding:0.8rem;border-radius:12px;margin-bottom:1rem;">⏳ You have already submitted this task. Pending admin approval.</div>'; canStart=false; }
            if(existing?.status==='approved'){ statusMessage='<div style="background:#10b98120;padding:0.8rem;border-radius:12px;margin-bottom:1rem;">✅ You have already completed this task and received the reward.</div>'; canStart=false; }
            if(existing?.status==='rejected'){ statusMessage=`<div style="background:#ef444420;padding:0.8rem;border-radius:12px;margin-bottom:1rem;">❌ Previous submission rejected.<br>Reason: ${escapeHtml(existing.admin_feedback||existing.rejection_reason||'Not provided')}<br>You can try again.</div>`; canStart=true; }
            let countdownHtml = ''; if(task.deadline) countdownHtml = `<div class="countdown-large" id="modalCountdown"></div>`;
            const modalContent = `<div class="task-modal-content"><h2>${escapeHtml(task.title)}</h2><div class="reward-badge" style="font-size:1.2rem;">+₹${task.reward}</div><p><strong>Description:</strong><br>${escapeHtml(task.description)}</p><div class="help-text"><i class="fas fa-info-circle"></i> Help & Instructions:<br>${task.help_text||'No additional help provided.'}</div>${countdownHtml}${statusMessage}<div class="modal-btn-group">${task.link?`<button id="modalVisitLinkBtn" class="btn-primary btn-visit"><i class="fas fa-external-link-alt"></i> Visit Task Link</button>`:''}${canStart?`<button id="modalStartTaskBtn" class="btn-primary btn-start"><i class="fas fa-play"></i> Start Task & Submit</button>`:'<button disabled style="opacity:0.5;">Already Submitted</button>'}</div><button id="modalCloseBtn" class="btn-close-modal"><i class="fas fa-times"></i> Close</button></div>`;
            Swal.fire({ title:'Task Details', html:modalContent, showConfirmButton:false, showCancelButton:false, didOpen:()=>{
                if(task.deadline){
                    const deadline=new Date(task.deadline), countdownEl=document.getElementById('modalCountdown');
                    const update=()=>{ const now=new Date(), diff=deadline-now; if(diff<=0){ countdownEl.innerHTML="⏰ Task expired"; countdownEl.style.color="#ef4444"; if(document.getElementById('modalStartTaskBtn')) document.getElementById('modalStartTaskBtn').disabled=true; return; } const hours=Math.floor(diff/3600000), minutes=Math.floor((diff%3600000)/60000), seconds=Math.floor((diff%60000)/1000); countdownEl.innerHTML=`⏳ Deadline: ${hours}h ${minutes}m ${seconds}s`; };
                    update(); const interval=setInterval(update,1000); window.modalCountdownInterval=interval;
                }
                document.getElementById('modalVisitLinkBtn')?.addEventListener('click',()=>window.open(task.link,'_blank'));
                document.getElementById('modalStartTaskBtn')?.addEventListener('click',async()=>{ Swal.close(); if(window.modalCountdownInterval) clearInterval(window.modalCountdownInterval); await startTask(task); });
                document.getElementById('modalCloseBtn')?.addEventListener('click',()=>{ if(window.modalCountdownInterval) clearInterval(window.modalCountdownInterval); Swal.close(); });
            }, willClose:()=>{ if(window.modalCountdownInterval) clearInterval(window.modalCountdownInterval); } });
        }
        async function startTask(task) {
            const { data: existing } = await supabase.from('submissions').select('id,status,submission_data').eq('uid',currentUser.id).eq('task_id',task.id).maybeSingle();
            if(existing?.status==='pending') return toast("Already pending.","warning");
            if(existing?.status==='approved') return toast("Already completed!","success");
            let fieldsHtml=''; const prevData=existing?.submission_data||{};
            for(const f of (task.custom_fields||[])){
                const prevValue=prevData[f.label]||'';
                if(f.type==='file'){
                    fieldsHtml+=`<div style="margin-bottom:1rem;"><label>${escapeHtml(f.label)} ${f.required?'*':''}</label><input type="file" id="field_${f.label.replace(/\s/g,'_')}" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,.txt" ${f.required?'required':''} class="file-upload-input">${prevValue?`<div><small>Previously uploaded: <a href="${await getSignedUrl(prevValue)}" target="_blank">View previous file</a></small></div>`:''}</div>`;
                } else {
                    fieldsHtml+=`<div style="margin-bottom:1rem;"><label>${escapeHtml(f.label)} ${f.required?'*':''}</label><input type="${f.type}" id="field_${f.label.replace(/\s/g,'_')}" value="${escapeHtml(prevValue)}" ${f.required?'required':''}></div>`;
                }
            }
            const { value: formData } = await Swal.fire({
                title: task.title, html: `<div><p>${escapeHtml(task.description)}</p><p>Reward: ₹${task.reward}</p>${task.link?`<a href="${task.link}" target="_blank">Open Task Link</a><br>`:''}<div class="help-content">${task.help_text||''}</div><hr>${fieldsHtml}</div>`, width: '700px',
                preConfirm: async () => {
                    let submissionData = {};
                    for(const f of (task.custom_fields||[])){
                        const input = document.getElementById(`field_${f.label.replace(/\s/g,'_')}`);
                        if(f.type==='file'){
                            const file = input.files[0];
                            if(f.required && !file && !prevData[f.label]){ Swal.showValidationMessage(`${f.label} required`); return false; }
                            if(file){
                                const ext = file.name.split('.').pop().toLowerCase();
                                if(!['jpg','jpeg','png','pdf','doc','docx','txt'].includes(ext)){ Swal.showValidationMessage(`${f.label}: only images, PDF, DOC, TXT allowed`); return false; }
                                const path = `task_submissions/${currentUser.id}/${task.id}/${Date.now()}_${file.name}`;
                                const { error } = await supabase.storage.from('task_submissions').upload(path, file);
                                if(error){ Swal.showValidationMessage(error.message); return false; }
                                submissionData[f.label] = path;
                            } else if(prevData[f.label]){ submissionData[f.label] = prevData[f.label]; }
                        } else {
                            const val = input.value;
                            if(f.required && !val){ Swal.showValidationMessage(`${f.label} required`); return false; }
                            submissionData[f.label] = val;
                        }
                    }
                    return { submissionData };
                }
            });
            if(formData){
                if(existing?.id) await supabase.from('submissions').update({ submission_data: formData.submissionData, status: 'pending', admin_feedback: null }).eq('id', existing.id);
                else await supabase.from('submissions').insert({ uid: currentUser.id, task_id: task.id, submission_data: formData.submissionData, status: 'pending', reward: task.reward });
                toast("Task submitted for review!", "success");
                renderPanel('tasks');
            }
        }

        async function savePersonalInfo() {
            const fullName = document.getElementById('fullName')?.value.trim();
            const dob = document.getElementById('dob')?.value.trim();
            const mobile = document.getElementById('mobile')?.value.trim();
            if (!fullName || !dob || !mobile) return toast("All fields are required", "error");
            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dob)) return toast("Date of birth must be in DD/MM/YYYY format", "error");
            if (!/^\d{10}$/.test(mobile)) return toast("Mobile number must be 10 digits", "error");
            const { data: existing } = await supabase.from('verifications').select('id').eq('uid', currentUser.id).maybeSingle();
            if (existing) {
                const { error } = await supabase.from('verifications').update({ full_name: fullName, date_of_birth: dob, mobile_number: mobile }).eq('uid', currentUser.id);
                if (error) toast(error.message, "error");
                else toast("Personal information saved! Now upload your KYC documents.", "success");
            } else {
                const { error } = await supabase.from('verifications').insert({ uid: currentUser.id, full_name: fullName, date_of_birth: dob, mobile_number: mobile, status: 'pending' });
                if (error) toast(error.message, "error");
                else toast("Personal information saved! Now upload your KYC documents.", "success");
            }
            renderPanel('kyc');
        }
        async function submitKyc() {
            const aadhaarNum = document.getElementById('aadhaarNum')?.value.trim();
            const selfieFile = document.getElementById('selfieImage')?.files[0];
            if (!aadhaarNum || aadhaarNum.length < 10) return toast("Valid Aadhaar number required", "error");
            if (!selfieFile) return toast("Selfie holding Aadhaar card is required", "error");
            toast("Uploading...", "info");
            try {
                const upload = async (file, name) => {
                    const path = `${currentUser.id}/kyc/${name}_${Date.now()}.${file.name.split('.').pop()}`;
                    const { error } = await supabase.storage.from('kyc_docs').upload(path, file);
                    if (error) throw error;
                    return path;
                };
                const selfiePath = await upload(selfieFile, 'selfie');
                const { error } = await supabase.from('verifications').update({ aadhaar_number: aadhaarNum, selfie_image: selfiePath, status: 'pending', submitted_at: new Date() }).eq('uid', currentUser.id);
                if (error) throw error;
                toast("KYC submitted! Pending review.", "success");
                renderPanel('kyc');
            } catch (e) { toast("Submission failed: "+e.message, "error"); }
        }

        async function requestWithdrawal(amount, methodId) {
            if(userProfile.verification_status !== 'verified') return toast("Complete KYC first","error");
            if(amount < 200) return toast("Minimum withdrawal is ₹200","error");
            if(amount > userProfile.balance) return toast("Insufficient balance","error");
            const { data: method } = await supabase.from('payment_methods').select('*').eq('id', methodId).single();
            let details = method.details;
            if(method.type === 'bank'){ const d=JSON.parse(details); details = `${d.name}, A/c:${d.account}, IFSC:${d.ifsc}`; }
            const newBalance = userProfile.balance - amount;
            await supabase.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
            await supabase.from('balance_history').insert({ uid: currentUser.id, amount_change: -amount, new_balance: newBalance, reason: `Withdrawal request (pending)`, created_by: currentUser.id });
            const { error } = await supabase.from('withdrawals').insert({ uid: currentUser.id, amount, method:method.type, details, status:'pending' });
            if(error) { await supabase.from('profiles').update({ balance: userProfile.balance }).eq('id', currentUser.id); toast(error.message, "error"); }
            else { toast("Withdrawal request sent! Amount deducted from balance.", "success"); renderPanel('withdraw'); }
        }

        let currentTab = 'dashboard';
        async function renderPanel(tab) {
            const container = document.getElementById('dashboardMain');
            if(tab === 'dashboard') container.innerHTML = await renderDashboard();
            else if(tab === 'tasks') { container.innerHTML = await renderTasks(); attachTaskEvents(); }
            else if(tab === 'submissions') { container.innerHTML = await renderMySubmissions(); attachSubmissionEvents(); }
            else if(tab === 'referrals') container.innerHTML = await renderReferrals();
            else if(tab === 'kyc') container.innerHTML = await renderKyc();
            else if(tab === 'withdraw') container.innerHTML = await renderWithdraw();
            else if(tab === 'transactions') container.innerHTML = await renderTransactions();
            else if(tab === 'leaderboard') container.innerHTML = await renderLeaderboard();
            else if(tab === 'chat') container.innerHTML = await renderChat();
            attachCommonEvents();
        }
        function attachTaskEvents() { document.querySelectorAll('.task-card').forEach(card=>card.addEventListener('click',()=>showTaskDetailModal(JSON.parse(card.dataset.task)))); }
        function attachSubmissionEvents() {
            document.querySelectorAll('.viewSubmissionBtn').forEach(btn=>{ const card=btn.closest('.submission-card'); const submission=JSON.parse(card.dataset.submission); const task=JSON.parse(card.dataset.task); btn.addEventListener('click',()=>viewSubmissionDetails(submission,task)); });
            document.querySelectorAll('.resubmitBtn').forEach(btn=>{ const card=btn.closest('.submission-card'); const submission=JSON.parse(card.dataset.submission); const task=JSON.parse(card.dataset.task); btn.addEventListener('click',async()=>{ await startTask(task); }); });
        }
        function attachCommonEvents() {
            document.getElementById('copyCodeBtn')?.addEventListener('click',()=>{ navigator.clipboard.writeText(userProfile.referral_code); toast("Code copied!"); });
            document.getElementById('copyLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
            document.getElementById('copyFullLinkBtn')?.addEventListener('click',()=>{ let l=`${location.origin}${location.pathname}?ref=${userProfile.referral_code}`; navigator.clipboard.writeText(l); toast("Link copied"); });
            document.getElementById('savePersonalInfoBtn')?.addEventListener('click', savePersonalInfo);
            document.getElementById('submitKycBtn')?.addEventListener('click', submitKyc);
            document.getElementById('addMethodBtn')?.addEventListener('click', addPaymentMethod);
            document.querySelectorAll('.deleteMethod').forEach(btn=>btn.addEventListener('click',async()=>{ await deletePaymentMethod(btn.dataset.id); }));
            document.getElementById('wdForm')?.addEventListener('submit',async(e)=>{ e.preventDefault(); const methodId = document.getElementById('wdMethod').value; const amount = parseInt(document.getElementById('wdAmount').value); await requestWithdrawal(amount, methodId); });
            document.getElementById('sendMsgBtn')?.addEventListener('click',async()=>{ let msg=document.getElementById('userChatMsg').value; if(msg){ await supabase.from('support_messages').insert({ uid:currentUser.id, message:msg, is_admin:false }); document.getElementById('userChatMsg').value=''; renderPanel('chat'); } });
            const preview = (id, previewId) => { const inp = document.getElementById(id); if(inp) inp.addEventListener('change',(e)=>{ if(e.target.files[0]){ const reader = new FileReader(); reader.onload = ev => { const img = document.getElementById(previewId); if(img) { img.src = ev.target.result; img.style.display='block'; } }; reader.readAsDataURL(e.target.files[0]); } }); };
            preview('selfieImage','previewSelfie');
            document.querySelectorAll('.dropdown-header').forEach(h=>{ h.addEventListener('click',()=>{ const cont = document.getElementById(h.getAttribute('data-dropdown')+'Content'); cont.classList.toggle('open'); const icon = h.querySelector('i'); if(cont.classList.contains('open')) icon.classList.replace('fa-chevron-down','fa-chevron-up'); else icon.classList.replace('fa-chevron-up','fa-chevron-down'); }); });
        }

        function renderFullDashboard() {
            return `<div class="dashboard-container"><div class="sidebar"><div class="logo">🎮 GAMELOOT</div><div class="nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div><div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Earn Tasks</span></div><div class="nav-item" data-tab="submissions"><i class="fas fa-history"></i><span>My Submissions</span></div><div class="nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Referrals</span></div><div class="nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div><div class="nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div><div class="nav-item" data-tab="transactions"><i class="fas fa-exchange-alt"></i><span>Transactions</span></div><div class="nav-item" data-tab="leaderboard"><i class="fas fa-trophy"></i><span>Leaderboard</span></div><div class="nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Support</span></div></div><div class="main-panel" id="dashboardMain"></div></div><div class="bottom-nav"><div class="bottom-nav-item active" data-tab="dashboard"><i class="fas fa-home"></i><span>Home</span></div><div class="bottom-nav-item" data-tab="tasks"><i class="fas fa-tasks"></i><span>Tasks</span></div><div class="bottom-nav-item" data-tab="submissions"><i class="fas fa-history"></i><span>My Subs</span></div><div class="bottom-nav-item" data-tab="referrals"><i class="fas fa-user-plus"></i><span>Refer</span></div><div class="bottom-nav-item" data-tab="kyc"><i class="fas fa-id-card"></i><span>KYC</span></div><div class="bottom-nav-item" data-tab="withdraw"><i class="fas fa-rupee-sign"></i><span>Withdraw</span></div><div class="bottom-nav-item" data-tab="transactions"><i class="fas fa-exchange-alt"></i><span>Trans</span></div><div class="bottom-nav-item" data-tab="leaderboard"><i class="fas fa-trophy"></i><span>Top</span></div><div class="bottom-nav-item" data-tab="chat"><i class="fas fa-headset"></i><span>Chat</span></div><div class="bottom-nav-item" id="bottomLogoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div></div>`;
        }
        function initDashboard() {
            const root = document.getElementById('root');
            root.innerHTML = renderFullDashboard();
            renderPanel('dashboard');
            document.querySelectorAll('.nav-item[data-tab], .bottom-nav-item[data-tab]').forEach(el => {
                el.addEventListener('click', () => { const tab = el.getAttribute('data-tab'); document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(n=>n.classList.remove('active')); document.querySelectorAll(`.nav-item[data-tab="${tab}"], .bottom-nav-item[data-tab="${tab}"]`).forEach(n=>n.classList.add('active')); renderPanel(tab); });
            });
            document.getElementById('bottomLogoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
        }
        function renderHeroPage() {
            return `<div class="top-bar"><div class="logo">🎮 GAMELOOT</div><div class="right-actions"></div></div><div class="hero"><h1>Work Small, Earn Big</h1><p>Complete simple tasks, get rewarded instantly. Join thousands earning daily with GameLoot.</p><div class="hero-buttons"><button id="heroGetStarted" class="btn-primary">Get Started →</button><button id="heroLoginBtn" class="btn-outline">I already have an account</button></div><div class="feature-cards"><div class="feature-card"><i class="fas fa-tasks"></i><h3>Micro Tasks</h3><p>Earn ₹10–500 per task</p></div><div class="feature-card"><i class="fas fa-wallet"></i><h3>Fast Withdrawals</h3><p>UPI, Bank, Crypto</p></div><div class="feature-card"><i class="fas fa-users"></i><h3>Referral Bonuses</h3><p>₹50 + 10% commission</p></div></div></div>`;
        }
        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                document.getElementById('root').innerHTML = renderHeroPage();
                document.getElementById('heroGetStarted')?.addEventListener('click', showSignUpModal);
                document.getElementById('heroLoginBtn')?.addEventListener('click', showSignInModal);
                return;
            }
            currentUser = user;
            if (!user.email_confirmed_at) {
                document.getElementById('root').innerHTML = `<div class="hero"><h2>Email not verified</h2><p>Please check your inbox and click the verification link.</p><button id="resendBtn" class="btn-primary">Resend verification email</button></div>`;
                document.getElementById('resendBtn')?.addEventListener('click', async () => { await supabase.auth.resend({ type: 'signup', email: user.email }); toast("Verification email resent!","success"); });
                return;
            }
            try {
                userProfile = await ensureProfile(user.id, user.email, user.user_metadata?.name);
                const ref = new URLSearchParams(window.location.search).get('ref');
                if (ref && !userProfile.referred_by) { await supabase.from('profiles').update({ referred_by: ref }).eq('id', user.id); toast("Referral code applied!","success"); }
                initDashboard();
                const topBar = document.querySelector('.top-bar');
                if(topBar && !topBar.querySelector('.right-actions .notif-bell')) {
                    const rightDiv = document.createElement('div');
                    rightDiv.className = 'right-actions';
                    rightDiv.innerHTML = `<div class="notif-bell"><i class="fas fa-bell"></i></div><button id="topLogoutBtn" class="logout-btn">Logout</button>`;
                    topBar.appendChild(rightDiv);
                    document.querySelector('.notif-bell').addEventListener('click', showNotifications);
                    document.getElementById('topLogoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
                }
                await fetchNotifications();
                updateNotifBell();
            } catch(err) {
                document.getElementById('root').innerHTML = `<div class="hero"><h2>Error</h2><p>${err.message}</p><button class="btn-primary" onclick="location.reload()">Retry</button></div>`;
                console.error(err);
            }
        })();
    })();
</script>
</body>
</html>
